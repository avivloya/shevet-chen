<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<title>Shevet Chen</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" href="icon-192.png?v=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shevet Chen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=3"></script>
<script src="bridge.js?v=7"></script>
</head>
<body>
<title>Shevet Chen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Heebo:wght@300;400;500&display=swap">
<style>
/* Layout: quiet off-white page, white header with a small green logo pill and text tabs, content in a 1040px column of white cards; pink & green only as small accents */
:root{
  --bg:#f6f1e8; --surface:#ffffff; --ink:#1e3a2f; --muted:#6f8178; --line:#e9e1d6;
  --pink:#f3c9d6; --pink-soft:#fbeef2; --rose:#b84c72;
  --mint:#cfe6d8; --mint-soft:#eef6f1; --green:#2f6b52;
  --butter:var(--pink-soft); --lilac:var(--mint-soft);
  --ok:#2f6b52; --late:#b84c72; --bad:#b84c72; --on-accent:#ffffff;
  --logo-bg:#2f6b52; --l1:#ffffff; --l2:#f7c3d4; --l3:#bfe5cf;
  --display:"Frank Ruhl Libre","Heebo",Georgia,serif;
  --body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --shadow:0 1px 2px rgba(30,58,47,.04),0 4px 16px rgba(30,58,47,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1b2420; --ink:#eef3ef; --muted:#9fb1a7; --line:#2a3530;
  --pink:#5c3443; --pink-soft:#2a1f24; --rose:#f2a9c0; --mint:#2c4a3c; --mint-soft:#1c2a23; --green:#9fd3b6;
  --ok:#9fd3b6; --late:#f2a9c0; --bad:#f2a9c0; --on-accent:#141a17; --logo-bg:#2f6b52;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1b2420; --ink:#eef3ef; --muted:#9fb1a7; --line:#2a3530;
  --pink:#5c3443; --pink-soft:#2a1f24; --rose:#f2a9c0; --mint:#2c4a3c; --mint-soft:#1c2a23; --green:#9fd3b6;
  --ok:#9fd3b6; --late:#f2a9c0; --bad:#f2a9c0; --on-accent:#141a17; --logo-bg:#2f6b52;
  --shadow:none; color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
.bubbles{display:none}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:1.65rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:14px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center;background:var(--logo-bg);border-radius:999px;padding:7px 18px;font-family:var(--display);font-weight:500;font-size:1.15rem;line-height:1.1;white-space:nowrap}
.logo .c0{color:var(--l1)} .logo .c1{color:var(--l2)} .logo .c2{color:var(--l3)}
.brand small{font-size:.8rem;color:var(--muted)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.me-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font-size:.875rem}
[dir="rtl"] .me-btn{padding:4px 4px 4px 14px}
.me-btn:hover{border-color:var(--green)}
.logo-img{margin:0;line-height:0;color:var(--ink)}.logo-img a{display:block;color:inherit}.logo-img svg{height:78px;width:auto;display:block}
@media (max-width:600px){.logo-img svg{height:60px}}
.home-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px 28px;flex-wrap:wrap}
.home-hero h2{font-size:2.3rem}
.group-btns{display:flex;flex-wrap:wrap;gap:8px}
.group-btn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--pink);border-radius:999px;padding:10px 20px;cursor:pointer;font-family:var(--display);font-size:1.05rem;color:var(--ink);box-shadow:var(--shadow);text-align:start}
.group-btn small{font-family:var(--body);font-size:.74rem;color:var(--muted);display:block}
.group-btn .arrow{color:var(--rose)}
[dir="rtl"] .group-btn .arrow{transform:scaleX(-1)}
.group-btn:hover{border-color:var(--rose)}
.group-btn.mine{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.group-btn.mine small,.group-btn.mine .arrow{color:inherit;opacity:.85}
.date-badge{width:54px;flex:none;text-align:center;border-radius:14px;background:var(--mint-soft);padding:7px 0;line-height:1.15}
.date-badge b{display:block;font-family:var(--display);font-size:1.45rem;font-weight:500;color:var(--green)}
.date-badge span{font-size:.72rem;color:var(--muted)}
.group-hero{display:grid;gap:6px;border-top:3px solid var(--pink)}
.group-hero h2{font-size:2.1rem}
.task.done b{text-decoration:line-through;color:var(--muted);font-weight:400}
.need-row{display:flex;gap:12px;align-items:center;padding:12px 18px}
.need-row+.need-row{border-top:1px solid var(--line)}
.need-in{margin-top:4px;width:100%;padding:4px 8px!important;font-size:.86rem!important;background:transparent!important;border-color:transparent!important}
.need-in:hover,.need-in:focus{background:var(--surface)!important;border-color:var(--line)!important}
.need-st{font-size:.74rem;border-radius:999px;padding:3px 12px;white-space:nowrap;border:1px solid transparent;font-family:inherit}
button.need-st{cursor:pointer}
.need-st.packed{background:var(--mint-soft);color:var(--green);border-color:var(--mint)}
.need-st.notPacked{background:var(--pink-soft);color:var(--rose);border-color:var(--pink)}
.need-st.none{background:var(--bg);color:var(--muted);border-color:var(--line)}
.mx-cat{padding:18px 18px 6px;font-family:var(--display);font-size:1.02rem;color:var(--green);border-top:1px solid var(--line)}
.mx-cat:first-child{border-top:0;padding-top:14px}
.mx-row{display:flex;gap:12px;align-items:center;padding:9px 18px;flex-wrap:wrap}
.mx-row:hover{background:var(--bg)}
.mx-name{font-weight:500}
.mx-need{margin-inline-start:8px;font-size:.72rem;color:var(--rose)}
.mx-need::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rose);margin-inline-end:5px;vertical-align:middle}
.mx-amt{min-width:72px;text-align:end;color:var(--muted);font-size:.9rem}
.mx-amt-in{width:96px!important;padding:4px 8px!important;text-align:end;background:transparent!important;border-color:transparent!important;color:var(--muted);font-size:.9rem!important}
.mx-amt-in:hover,.mx-amt-in:focus{border-color:var(--line)!important;background:var(--surface)!important;color:var(--ink)}
.mx-x{background:none;border:0;color:var(--muted);font-size:1.15rem;line-height:1;padding:4px 6px;cursor:pointer;border-radius:50%;opacity:.55}
.mx-row:hover .mx-x,.mx-x:focus{opacity:1}.mx-x:hover{color:var(--rose)}
.mx-row .mx-req-form{margin-top:4px}
.mx-count{text-align:center;min-width:64px}
.mx-count b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.mx-count span{font-size:.75rem;color:var(--muted)}
.mx-count b.txt{font-family:var(--body);font-size:.95rem;font-weight:500}
.mx-avail{font-size:.78rem;color:var(--green)}
.mx-avail.low{color:var(--rose)}
.mx-req-form{width:100%;display:grid;gap:10px;background:var(--bg);border-radius:14px;padding:14px}
.st{font-size:.72rem;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.pending{background:var(--pink-soft);color:var(--rose)} .st.approved{background:var(--mint-soft);color:var(--green)}
.st.declined{background:var(--bg);color:var(--muted)} .st.returned{background:var(--bg);color:var(--muted)}
.qty-in{width:84px!important;padding:6px 10px!important;text-align:center}
.me-btn .av{width:30px;height:30px;font-size:.8rem}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av-big{width:96px!important;height:96px!important;font-size:2rem!important}
.photo-pick{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pill{display:inline-block;font-size:.72rem;border-radius:999px;padding:1px 9px;background:var(--mint-soft);color:var(--green)}
.lang{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px;border:1px solid var(--line);gap:2px}
.lang button{border:0;background:none;border-radius:999px;padding:6px 18px;cursor:pointer;color:var(--muted);font-size:.9rem}
.lang button[aria-pressed="true"]{background:var(--green);color:var(--on-accent);box-shadow:0 1px 3px rgba(30,58,47,.12)}
.lang.big button{padding:8px 22px}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:auto;accent-color:var(--green)}
.tabs-scroll{overflow-x:auto}
.tabs{display:flex;gap:4px;padding-block:6px 0}
.tabs a{color:var(--muted);text-decoration:none;padding:10px 14px 12px;white-space:nowrap;font-size:.92rem;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--rose)}
.banner{font-size:.875rem}
.banner .wrap{padding-block:10px 0}
.banner>div>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;color:var(--muted)}
.banner.demo>div>div{background:var(--pink-soft);border-color:var(--pink);color:var(--ink)}

main{padding-block:32px 72px}
.view{display:grid;gap:36px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:32px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px;min-width:0}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 20px;cursor:pointer;font-size:.9rem;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:var(--mint-soft);border-color:var(--mint);color:var(--green)}
.btn.warn{border-color:var(--pink);color:var(--rose)}
.btn.sm{padding:5px 14px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--rose);cursor:pointer;text-decoration:none;font-size:inherit;border-bottom:1px solid currentColor}
a.link{line-height:1.2}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
form.card{display:grid;gap:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
label{display:grid;gap:6px;font-size:.84rem;color:var(--muted);min-width:0}
input,select,textarea{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0;width:100%;box-sizing:border-box;color:var(--ink);font-size:.95rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);background:var(--surface)}
textarea{resize:vertical}

.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:14px;align-items:center;padding:14px 18px;flex-wrap:wrap}
.item+.item{border-top:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.empty{padding:28px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;font-size:.9rem;background:var(--surface)}
.list>.empty{border:0;border-radius:0}

.adder:not(.open){background:none;border:0;box-shadow:none;padding:0}
.adder:not(.open)>*:not(h3){display:none!important}
.adder>h3{cursor:pointer;user-select:none}
.adder:not(.open)>h3{display:inline-flex;align-items:center;gap:8px;font-family:var(--body);font-size:.95rem;font-weight:500;color:var(--green);background:var(--surface);border:1px dashed var(--green);border-radius:999px;padding:10px 18px}
.adder:not(.open)>h3::before{content:'+';font-size:1.15rem;line-height:1}
.adder.open>h3::after{content:'×';float:inline-end;color:var(--muted);font-family:var(--body)}
.mx-side{order:2}
@media (min-width:701px){#v-machsan .cols{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:14px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);text-decoration:none;font:inherit;width:100%;box-sizing:border-box;min-width:0}
.tile:hover{border-color:var(--rose)}
.tile.main{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.tile.main .tile-sub,.tile.main .arrow{color:inherit;opacity:.85}
.tile .grow{flex:1;min-width:0}
.tile-title{display:block;font-family:var(--display);font-size:1.2rem;line-height:1.25}
.tile-sub{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.tile .arrow{color:var(--rose);font-size:1.1rem}
.tile .badge{background:var(--pink-soft);color:var(--rose);border-radius:999px;padding:2px 9px;font-size:.78rem;margin-inline-start:6px;font-family:var(--body);vertical-align:middle;white-space:nowrap;display:inline-block}
.page-help{color:var(--muted);margin:-4px 0 4px;font-size:.95rem}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more>summary{cursor:pointer;color:var(--rose);font-size:.9rem;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'+ '}
details.more[open]>summary::before{content:'− '}
details.more[open]>summary{margin-bottom:12px}
details.more>div{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
.stat:nth-child(odd){border-top:3px solid var(--pink)} .stat:nth-child(even){border-top:3px solid var(--mint)}
.stat b{font-family:var(--display);font-size:2.1rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1;order:-1}
.stat b.sm{font-size:1.1rem;line-height:1.35}
.stat .muted{font-size:.82rem}

.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:500;flex:none;font-size:.85rem;color:var(--ink);overflow:hidden}
.tier1{background:var(--pink-soft);color:var(--rose)} .tier2{background:var(--mint-soft);color:var(--green)}
.tier3{background:var(--pink-soft);color:var(--rose)} .tier4{background:var(--mint-soft);color:var(--green)}
.role{font-size:.74rem;border-radius:999px;padding:2px 10px;white-space:nowrap}
.group-h{display:flex;gap:10px;align-items:center;margin-top:22px;margin-bottom:10px}
.group-h:first-child{margin-top:0}
.pct{font-variant-numeric:tabular-nums}

.due{padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--rose);border-radius:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.due .dot{display:none}
.due .grow{flex:1;min-width:0}

.sess{cursor:pointer;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sess[aria-pressed="true"]{border-color:var(--green)}
.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-variant-numeric:tabular-nums;flex:none}
.mark-row{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.mark-row .grow{flex:1;min-width:0}
.dots{display:inline-flex;gap:6px}
.dots button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.8rem}
.dots button[aria-pressed="true"].p{background:var(--mint);border-color:var(--mint)}
.dots button[aria-pressed="true"].l,.dots button[aria-pressed="true"].a{background:var(--pink);border-color:var(--pink)}
.tally{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tally .p{color:var(--green)} .tally .l,.tally .a{color:var(--rose)}

.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cal-head h3{flex:1;text-align:center}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(36px,1fr));gap:4px}
.dow{font-size:.72rem;text-align:center;color:var(--muted);letter-spacing:.06em;padding-bottom:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:50%;border:1px solid transparent;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;padding:0;font-size:.9rem}
.day:hover{background:var(--bg)}
.day.out{opacity:.35}
.day.today{color:var(--rose);font-weight:500}
.day[aria-pressed="true"]{background:var(--green);color:var(--on-accent)}
.day .ds{display:flex;gap:2px;height:5px}
.day .ds i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.day[aria-pressed="true"] .ds i{background:var(--on-accent)}
.ev-time{font-variant-numeric:tabular-nums;min-width:5ch;color:var(--green);font-size:.9rem}
.tag{font-size:.72rem;border-radius:999px;padding:1px 9px;background:var(--mint-soft);color:var(--green);white-space:nowrap}

.cheny-fab{position:fixed;inset-inline-end:22px;bottom:22px;z-index:40;display:flex;align-items:center;gap:8px;padding:7px 18px 7px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;box-shadow:0 6px 24px rgba(30,58,47,.14);cursor:pointer}
[dir=rtl] .cheny-fab{padding:7px 7px 7px 18px}
.cheny-fab:hover{border-color:var(--pink)}
.cheny-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pink-soft);padding:3px;color:var(--rose);font-family:var(--display);font-weight:700;font-size:1.05rem;flex:none;position:relative}
.cheny-av::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--surface);bottom:0;inset-inline-end:0}
.cheny-av.big{width:40px;height:40px;font-size:1.2rem}
.cheny{position:fixed;inset-inline-end:22px;bottom:22px;z-index:41;width:min(400px,calc(100vw - 32px));height:min(600px,calc(100vh - 44px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 48px rgba(30,58,47,.2);display:flex;flex-direction:column;overflow:hidden}
.cheny-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cheny-head b{font-family:var(--display);font-size:1.08rem}

@media (max-width:640px){.cheny{inset-inline-end:8px;bottom:8px;width:calc(100vw - 16px);height:calc(100vh - 16px)}.cheny-fab{bottom:14px;inset-inline-end:14px}}

.pst.changes{background:var(--surface);color:var(--rose);border-color:var(--rose)}
.pst.approved{background:var(--mint-soft);color:var(--green);border-color:var(--mint)}
.pdoc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:28px clamp(18px,4vw,40px);display:grid;gap:22px;max-width:860px;width:100%;margin-inline:auto}
.pdoc-head{display:grid;gap:10px;border-bottom:1px solid var(--line);padding-bottom:18px}
.pdoc-title{font-family:var(--display);font-size:1.9rem;border:0!important;background:none!important;padding:0!important;color:var(--ink);width:100%}
.pdoc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

.pdoc textarea{min-height:96px;resize:vertical;line-height:1.55}
.pdoc textarea:disabled,.pdoc input:disabled{background:transparent!important;border-color:transparent!important;color:var(--ink);padding-inline:0!important;resize:none;opacity:1;-webkit-text-fill-color:var(--ink)}
.pf-lines{display:grid;gap:14px}
.pf-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.pf-line input{flex:1;min-width:140px}
.pf-val{font-family:var(--display);font-size:1.12rem;color:#7fb17f}
.pf-line textarea{min-height:64px}
.plan-wrap{overflow-x:auto}
.plan{width:100%;border-collapse:collapse;font-size:.9rem;border:1.5px solid var(--ink);min-width:620px}
.plan th,.plan td{padding:0;vertical-align:top}
.plan td{border:1px solid var(--ink)}
.plan th{font-family:var(--display);font-weight:700;font-size:1.02rem!important;color:#c98fae!important;padding:8px 10px!important}
.plan td textarea{width:100%;min-height:0!important;border:0!important;background:transparent!important;padding:8px!important;font-size:.88rem!important;resize:vertical;border-radius:0!important}

.plan th{text-align:start}
.plan td.tm{width:80px}.plan td.zm{width:140px}.plan td.mt{width:150px}
.plan td.x,.plan th.x{width:30px;border-inline-start:0}
.mx-pick{position:relative}

.mx-results button{display:flex;width:100%;gap:10px;align-items:center;justify-content:space-between;background:none;border:0;padding:9px 14px;font:inherit;cursor:pointer;color:var(--ink);text-align:start}

.mat-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.mat-row:first-child{border-top:0}
.pnote{background:var(--bg);border-radius:14px;padding:10px 14px;display:grid;gap:2px}
.pnote.rev{background:var(--pink-soft)}
.pbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;max-width:860px;width:100%;margin-inline:auto}
.saved-ind{font-size:.78rem;color:var(--muted)}
@media print{header,.tabs,#tabsWrap,.pbar,.cheny-fab,.cheny,.banner,.no-print{display:none!important}.pdoc{box-shadow:none;border:0}}
.chat.sm{height:520px;min-height:0;max-width:none}
.chat-head{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.chat-head h2{font-size:1.25rem;margin:0}
.chat-icon{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;flex:none}
.chat-body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:3px;background:var(--bg)}
.chat-day{align-self:center;font-size:.74rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px;margin:14px 0 8px}
.b-row{display:flex;gap:8px;align-items:flex-end;max-width:78%}
.b-row.me{align-self:flex-end;flex-direction:row-reverse}
.b-row .av{width:30px;height:30px;font-size:.75rem;flex:none}
.b-row .av-sp{width:30px;flex:none}
.b-row.first{margin-top:10px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:18px;border-end-start-radius:6px;padding:8px 14px 6px;display:grid;gap:2px;min-width:90px}
.b-row.me .bubble{background:var(--green);border-color:var(--green);color:#fff;border-radius:18px;border-end-end-radius:6px}
.b-name{font-size:.76rem;font-weight:600;color:var(--rose)}
.b-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.b-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;font-size:.68rem;opacity:.7}
.b-aud{border:1px solid currentColor;border-radius:999px;padding:0 7px}
.b-acts{display:flex;gap:10px;font-size:.72rem;opacity:0;transition:opacity .15s;padding:0 4px 2px}
.b-row:hover .b-acts,.b-row:focus-within .b-acts{opacity:1}
.b-acts button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:inherit}
.b-acts button:hover{color:var(--rose)}
.chat-compose{border-top:1px solid var(--line);padding:10px 14px 14px;display:grid;gap:8px;background:var(--surface)}
.chat-aud summary{cursor:pointer;color:var(--muted);list-style:none}
.chat-aud summary::-webkit-details-marker{display:none}
.chat-aud[open] summary{margin-bottom:8px}
.chat-input{display:flex;gap:8px;align-items:flex-end}
.chat-input textarea{flex:1;resize:none;border-radius:22px!important;padding:10px 16px!important;max-height:140px;min-height:44px}
.send-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--green);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
[dir=rtl] .send-btn svg{transform:scaleX(-1)}
.send-btn:hover{filter:brightness(1.08)}
.chat-locked{border-top:1px solid var(--line);padding:14px;text-align:center;color:var(--muted);background:var(--surface)}
.chat-empty{margin:auto;color:var(--muted);text-align:center}
@media (max-width:640px){.chat{height:calc(100vh - 150px)}.b-row{max-width:90%}}
.msg{padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:10px;box-shadow:var(--shadow)}
.msg-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem}
.msg-text{white-space:pre-wrap;overflow-wrap:anywhere}
.msg-actions{display:flex;gap:16px;flex-wrap:wrap;font-size:.86rem}
.thread{padding:14px;background:var(--bg);border-radius:14px;display:grid;gap:12px}
.reply{display:grid;gap:2px}
.reply-form{display:flex;gap:8px}
.lock{font-size:.84rem;color:var(--muted)}

.matrix-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table.matrix{border-collapse:collapse;width:100%;min-width:720px;font-size:.86rem}
table.matrix.att{min-width:0;width:auto}
.matrix th,.matrix td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
.matrix th:first-child,.matrix td:first-child{text-align:start;padding-inline-start:18px;white-space:nowrap}
.matrix thead th{font-weight:400;color:var(--muted);vertical-align:bottom;font-size:.8rem}
.matrix tr:last-child td{border-bottom:0}
.acc-grp{display:inline-flex;align-items:center;gap:10px}.acc-grp select{width:auto;font-family:var(--body);font-size:.88rem;padding:6px 32px 6px 12px}
.matrix tr.mx-sub td{text-align:start;font-family:var(--display,inherit);color:var(--green);background:var(--bg);padding-top:16px;font-size:.9rem;white-space:normal}
.tick{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;padding:0;display:inline-grid;place-items:center;margin:0}
.tick:checked{background:var(--green);border-color:var(--green)}
.tick:checked::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--on-accent)}
.tick:disabled{cursor:not-allowed;opacity:.6}
.grp{font-size:.7rem!important;letter-spacing:.12em;text-transform:uppercase}
.att th,.att td{white-space:nowrap}
.att td:first-child,.att th:first-child{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1}
.att .who-cell{display:flex;align-items:center;gap:10px}
.att .who-cell .av{width:30px;height:30px;font-size:.75rem}
.att .col-h{display:grid;gap:3px;font-size:.78rem;justify-items:center}
.att .col-h b{font-family:var(--display);font-size:1rem;font-weight:500;color:var(--ink)}
.yn{min-width:48px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.8rem;padding:0 10px}
.yn:hover:not(:disabled){border-color:var(--green)}
.yn.yes{background:var(--mint-soft);border-color:var(--mint);color:var(--green)}
.yn.no{background:var(--pink-soft);border-color:var(--pink);color:var(--rose)}
.yn:disabled{cursor:default}
.na{color:var(--muted)}
.bar-row{display:grid;grid-template-columns:minmax(100px,190px) minmax(0,1fr) auto;gap:14px;align-items:center;padding-block:6px}
.bar-row .who-cell{display:flex;align-items:center;gap:10px;min-width:0}
.bar-row .who-cell b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.bar-row .av{width:28px;height:28px;font-size:.72rem}
.bar-track{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--pink)}
.bar-fill.zero{background:transparent}
.bar-num{font-variant-numeric:tabular-nums;min-width:6ch;text-align:end}
.perm-chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.perm-chip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 5px;cursor:pointer}
[dir="rtl"] .perm-chip{padding:4px 5px 4px 12px}
.perm-chip .tick{width:18px;height:18px}
.perm-chip:has(.tick:checked){border-color:var(--mint);background:var(--mint-soft)}

.gate{min-height:calc(100vh - 160px);display:grid;place-items:center;padding-block:32px}
.gate-box{width:100%;max-width:560px;display:grid;gap:20px;text-align:center}
.gate-box h2{font-size:2.2rem}
.portals{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.portal{border:1px solid var(--line);border-radius:var(--r);cursor:pointer;display:grid;gap:6px;padding:28px 22px;text-align:start;background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.portal:hover{transform:translateY(-2px)}
.portal.s{border-top:3px solid var(--pink)} .portal.p{border-top:3px solid var(--mint)}
.portal.s:hover{border-color:var(--pink)} .portal.p:hover{border-color:var(--mint)}
.portal b{font-family:var(--display);font-size:1.4rem;font-weight:500}
.portal span{font-size:.88rem;color:var(--muted)}
.gate form{text-align:start}
.wait{width:56px;height:56px;border-radius:50%;margin:0 auto;border:3px solid var(--mint-soft);border-top-color:var(--rose)}
.wait::after{content:none}
@media (prefers-reduced-motion:no-preference){.wait{animation:spin 1.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;z-index:20;max-width:calc(100% - 32px);font-size:.9rem}
.confirm{display:inline-flex;gap:6px;align-items:center}

/* ===== v27 "product" look: one typeface, tighter radii, flat surfaces, real app navigation ===== */
:root{--bg:#f7f7f4;--surface:#fff;--ink:#17211c;--muted:#68736d;--line:#e5e5df;--r:12px;
  --display:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;--shadow:0 1px 2px rgba(16,24,20,.04);--rose:#c0507a;--pink:#f2d2dd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111614;--surface:#181f1c;--line:#26302b;--shadow:none}}
:root[data-theme="dark"]{--bg:#111614;--surface:#181f1c;--line:#26302b;--shadow:none}
body{font-size:15px;line-height:1.55}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
h2{font-size:1.15rem} h3{font-size:1rem}
.home-hero h2{font-size:1.65rem} .group-hero h2{font-size:1.5rem}
.label{letter-spacing:.06em;font-size:.7rem}
main{padding-block:24px 72px}
.view{gap:24px}
.cols{gap:24px}
.card{padding:18px 20px}
.btn{border-radius:8px;padding:8px 16px;font-weight:500}
.btn.sm{border-radius:7px;padding:5px 12px}
input,select,textarea{border-radius:8px;background:var(--surface);padding:9px 12px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 15%,transparent)}
.me-btn{border-radius:8px;padding:4px 12px 4px 4px}
[dir="rtl"] .me-btn{padding:4px 4px 4px 12px}
.me-btn .av{width:28px;height:28px}
.group-btns{gap:8px}
.group-btn{border-radius:10px;border-color:var(--line);box-shadow:none;font-family:var(--body);font-weight:500;font-size:.95rem;padding:9px 14px}
.group-btn:hover{border-color:var(--green)}
.group-btn .arrow{color:var(--muted)}
.date-badge{border-radius:10px;width:48px;padding:6px 0}
.date-badge b{font-family:var(--body);font-weight:600;font-size:1.2rem}
.empty{border:0;background:none;text-align:start;padding:14px 2px}
.list>.empty{padding:16px 18px}
.page-help{font-size:.9rem;margin:-8px 0 0}
.item{padding:12px 16px}
.lang,.seg{border-radius:9px}
.lang button,.seg button{border-radius:7px}
.lang button[aria-pressed="true"]{box-shadow:none}
.pill,.tag,.role,.st,.pst,.need-st{border-radius:6px}
.due{border-radius:10px}
.adder:not(.open)>h3{border-radius:8px;border-style:solid;border-color:var(--line);color:var(--ink);font-weight:500;padding:8px 14px}
.adder:not(.open)>h3::before{color:var(--green)}
.adder:not(.open)>h3:hover{border-color:var(--green)}
details.more>summary{color:var(--green)}
a.link,.link{color:var(--green);border-bottom:0;font-weight:500}
.banner.demo>div>div,.banner>div>div{border-radius:10px}
.mx-cat{font-family:var(--body);font-weight:600;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.chat{border-radius:var(--r)}
.cheny-fab{box-shadow:0 2px 10px rgba(16,24,20,.12)}
/* nav with icons */
.tabs a{display:inline-flex;align-items:center;gap:7px;font-weight:500;padding:10px 12px 12px}
.tabs a svg{width:18px;height:18px;flex:none;opacity:.8}
.tabs a[aria-current="page"]{border-bottom-color:var(--green);color:var(--green)}
.tabs a[aria-current="page"] svg{opacity:1}
@media (max-width:700px){
  #tabsWrap{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px);max-width:none}
  .tabs{padding:0;gap:0;justify-content:space-around}
  .tabs a{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;font-size:.62rem;padding:8px 1px 7px;border-bottom:0;border-top:2px solid transparent;justify-content:center}
  .tabs a svg{width:22px;height:22px}
  .tabs a span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tabs a[aria-current="page"]{border-top-color:var(--green)}
  main{padding-bottom:110px}
  .cheny-fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .home-hero h2{font-size:1.45rem}
  .bar{padding-block:10px}
}
.mx-search{display:block}.mx-search input{padding:11px 14px;font-size:1rem}
.mx-req-line{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.mx-req-line label:first-child{width:90px}.mx-req-line .grow{flex:1;min-width:160px}
.mx-req-form{border-radius:10px}

/* v28 cleaner peula page */
#peulaBox{max-width:860px;margin-inline:auto;width:100%;min-width:0}
.pdoc{min-width:0;box-sizing:border-box;padding:24px clamp(16px,3.5vw,32px);gap:24px;box-shadow:none}
.pf-lines{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.pf-line{flex-direction:column;align-items:stretch;gap:5px;min-width:0}
.pf-line.col,.pf-lines>.small{grid-column:1/-1}
.pf-line label,.pf-lab{font-family:var(--body);font-weight:600;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:normal}
.pf-val{font-family:var(--body);font-size:1rem;font-weight:500;color:var(--ink);padding:10px 0}
.pf-line input{min-width:0;max-width:none!important;width:100%;box-sizing:border-box}
.pdoc input:disabled,.pdoc textarea:disabled{padding-block:10px}
.pdoc-sec{gap:10px;border-top:1px solid var(--line);padding-top:20px}
.pdoc-sec h3{font-size:1rem;font-weight:600;color:var(--ink)}
.plan-wrap{overflow:visible;border:1px solid var(--line);border-radius:10px}
.plan{min-width:0;border:0;table-layout:fixed}
.plan td{border:0;border-top:1px solid var(--line)}
.plan td+td{border-inline-start:1px solid var(--line)}
.plan th{font-family:var(--body);font-weight:600;font-size:.72rem!important;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)!important;background:var(--bg);padding:9px 10px!important}

.mx-step{display:flex;align-items:center;gap:2px;direction:ltr}
.mx-step button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer;line-height:1}
.mx-step b{min-width:28px;text-align:center;font-weight:600}
.mx-rm{background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px 6px}

.kiosk-b:last-child{border-bottom:0}

.kiosk-items{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px}

.kiosk-items li span:last-child{color:var(--muted);direction:ltr}

  <p class="page-help" data-t="help_peulot"></p>
  <div class="seg" role="group"><button type="button" data-pl="review" aria-pressed="true" data-t="plToReview"></button><button type="button" data-pl="all" aria-pressed="false" data-t="plAll"></button></div>
  <div class="stack" id="plList"></div>
</section>
<!-- PEULA (editor) -->
<section class="view" id="v-peula" hidden>
  <div id="peulaBox" class="stack"></div>
</section>

<!-- MACHSAN -->
<section class="view" id="v-more" hidden><div class="list more-list" id="moreList"></div></section>
<section class="view" id="v-machsan" hidden>
  <div class="sec-head"><h2 data-t="tab_machsan"></h2><span class="muted small" id="mxCount"></span></div>
  <p class="page-help" data-t="help_machsan"></p>
  <div class="cols">
    <div class="stack mx-side">
      <h2 id="mxReqHead"></h2>
      <div class="list" id="mxReqs"></div>
      <details class="more"><summary data-t="groupNeeds"></summary><div>
      <p class="small muted" id="needsHelp" data-t="groupNeedsHelp"></p>
      <div class="list" id="mxNeeds"></div></div></details>
      <form class="card adder" id="mxItemForm">
        <h3 data-t="addItem"></h3>
        <div class="row">
          <label for="mxName"><span data-t="itemName"></span><input id="mxName" required></label>
          <label for="mxQty"><span data-t="qty"></span><input id="mxQty" placeholder="12 / a lot / 2 boxes"></label>
        </div>
        <div class="row">
          <label for="mxCatIn"><span data-t="category"></span><input id="mxCatIn" list="mxCats"></label>
          <label for="mxLoc"><span data-t="location"></span><input id="mxLoc"></label>
        </div>
        <datalist id="mxCats"></datalist>
        <button class="btn primary" type="submit" data-t="addItem" style="justify-self:start"></button>
      </form>
    </div>
    <div class="stack">
      <label for="mxSearch" class="mx-search"><span class="sr" data-t="search"></span><input id="mxSearch" type="search" autocomplete="off"><select id="mxCat" hidden></select></label>
      <div class="list mx-grid" id="mxList"></div>
      <div class="mx-bar" id="mxBar" hidden><span class="grow" id="mxBarTx"></span><button type="button" id="mxReview"></button></div>
    </div>
  </div>
</section>

<!-- ACCESS (owner) -->
<section class="view" id="v-access" hidden>
  <p class="page-help" data-t="help_access"></p>
  <div class="stack">
    <div class="sec-head">
      <span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" id="previewGate" data-t="previewLogin"></button><button class="btn sm" type="button" id="previewParent" data-t="previewParent"></button></span></div>
    
  </div>
  <div class="stack">
    <h2 data-t="byPerson"></h2>
    <p class="muted small" data-t="byPersonHelp"></p>
    <div class="list" id="peopleAccess"></div>
  </div>
  <details class="more"><summary data-t="advanced"></summary><div>
    <h2 data-t="byPosition"></h2>
    <p class="muted small" data-t="byPositionHelp"></p>
    <div class="matrix-scroll"><table class="matrix" id="matrix"></table></div>
  </div></details>
</section>
</main>
</div>
<div class="toast" id="toast" hidden role="status"></div>

function swBind(card){var sx=0,sy=0,dx=0,dy=0,on=false;
  card.addEventListener('pointerdown',function(ev){on=true;sx=ev.clientX;sy=ev.clientY;dx=dy=0;card.setPointerCapture(ev.pointerId);card.style.transition='none'});
  card.addEventListener('pointermove',function(ev){if(!on)return;dx=ev.clientX-sx;dy=ev.clientY-sy;card.style.transform='translate('+dx+'px,'+Math.max(dy,0)+'px) rotate('+(dx/14)+'deg)';

document.addEventListener('click',function(ev){var b=ev.target.closest&&ev.target.closest('[data-take-kid],[data-take-att],[data-att-close],[data-att-p],[data-att-save],[data-sw],[data-sw-undo],[data-sw-list],[data-sw-again]');

  if(past.length){L.push("RECENT PAST EVENTS:");past.forEach(function(e){L.push("- "+e.date+" | "+e.title)})}
  var bs=d.broadcasts.slice().sort(function(x,y){return y.createdAt-x.createdAt}).slice(0,15);
  L.push("\nRECENT CHAT MESSAGES (newest first):");if(!bs.length)L.push("- none");bs.forEach(function(b){L.push("- "+ymd(new Date(b.createdAt))+" "+nameOf(b.authorId)+" to "+aname(b)+": "+String(b.text).slice(0,400))});
  var g=myGroup();if(g){var tk=(d.tasks||[]).filter(function(x){return x.role===g.role&&norm(x.unit||'')===norm(g.unit||'')});L.push("\nTHEIR GROUP TASKS:");if(!tk.length)L.push("- none");tk.forEach(function(x){L.push("- "+(x.done?"[done] ":"")+x.text+(x.due?" (due "+x.due+")":""))})}
  if(can('attendance')&&d.sessions.length){L.push("\nATTENDANCE ("+d.sessions.length+" dates): absences per person");d.roster.forEach(function(m){var ss=d.sessions.filter(function(x){return x.marks&&x.marks[m.id]});if(ss.length)L.push("- "+m.name+": absent "+ss.filter(function(x){return x.marks[m.id]==='a'}).length+" of "+ss.length)})}
  var pls=(d.peulot||[]);if(pls.length){L.push("\nPEULOT:");pls.slice(0,40).forEach(function(x){L.push("- "+(x.date||"no date")+" | "+gkLabel(x)+" | "+(x.title||"untitled")+" | "+(x.status||"draft"))})}
  if(can('machsan')){
    L.push("\nMACHSAN ITEMS (name: amount | category):");(d.items||[]).slice().sort(function(x,y){return String(x.category||'').localeCompare(String(y.category||''))}).forEach(function(i){var num=typeof i.qty==='number';L.push("- "+i.name+": "+(num?i.qty+(mxOut(i.id)?" ("+(i.qty-mxOut(i.id))+" available now)":""):(i.amount||'?'))+(i.category?" | "+i.category:"")+(i.location?" | "+i.location:"")+(i.needMore?" | NEED MORE":""))});
    L.push("WHAT EACH GROUP NEEDS:");(d.needs||[]).forEach(function(n){L.push("- "+n.group+" ("+(n.people||'')+"): "+(n.materials||'no materials')+" | "+({packed:'Packed',notPacked:'Not packed',none:'No materials'}[n.status]||n.status))});
    var rq=(d.mxReqs||[]).slice(0,25);if(rq.length){L.push("MACHSAN REQUESTS:");rq.forEach(function(r){L.push("- "+nameOf(r.requesterId)+": "+r.itemName+" x"+r.qty+" on "+r.from+(r.to?" until "+r.to:"")+" | "+r.status+(r.note?" | "+r.note:""))})}
  }
  return L.join("\n");
}
function chenyPrompt(){var notes=(demo?'':S.chenyNotes)||'';return CHENY_RULES+"\n\n== SHEVET NOTES (written by Aviv, trust these) ==\n"+(notes.trim()||"(none yet)")+"\n\n"+chenyData().slice(0,60000)}
function chenyMd(tx){var lines=esc(tx).split(/\n/),h='',inUl=false;lines.forEach(function(l){l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');var m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!inUl){h+='<ul>';inUl=true}h+='<li>'+m[1]+'</li>'}else{if(inUl){h+='</ul>';inUl=false}if(l.trim())h+='<p>'+l+'</p>'}});if(inUl)h+='</ul>';return h}
function chenyRender(live){
  var hello=t('chenyHi',{n:(function(){var n=meId&&!viewAs?nameOf(meId):'';return n&&n!==t('someone')?' '+n.split(' ')[0]:''})()});
  var h='<div class="c-msg bot" dir="auto">'+chenyMd(hello)+'</div>';
  chenyTurns.forEach(function(x){h+=x.role==='user'?'<div class="c-msg me" dir="auto">'+esc(x.content)+'</div>':'<div class="c-msg bot'+(x.err?' err':'')+'" dir="auto">'+chenyMd(x.content)+'</div>'});
  if(live!==undefined)h+='<div class="c-msg bot" dir="auto">'+(live?chenyMd(live):'<span class="c-think">'+t('chenyThinking')+'</span>')+'</div>';
  var lg=$('chenyLog');lg.innerHTML=h;lg.scrollTop=lg.scrollHeight;
  $('chenySugg').innerHTML=chenyTurns.length||live!==undefined?'':['chenyS1','chenyS2','chenyS3','chenyS4'].map(function(k){return '<button type="button" data-cask="'+k+'">'+t(k)+'</button>'}).join('');
  $('chenyIn').placeholder=t('chenyPh');$('chenySend').setAttribute('aria-label',t('send'));$('chenyStop').setAttribute('aria-label','Stop');
}
function chenyVis(){var m=mode(),on=m==='app'||m==='settings';$('chenyBtn').hidden=!on||chenyOpen;$('chenyPanel').hidden=!on||!chenyOpen;
  var tc=$('chenyTeach');if(tc){tc.hidden=!(isOwner&&!demo&&db);if(!tc.hidden&&document.activeElement!==$('chenyNotes'))$('chenyNotes').value=S.chenyNotes||''}}
function chenySetOpen(o){chenyOpen=o;$('chenyBtn').setAttribute('aria-expanded',String(o));chenyVis();if(o){chenyRender();setTimeout(function(){$('chenyIn').focus()},30)}else $('chenyBtn').focus()}
function getSample(){if(sampleTried)return Promise.resolve(sampleFn);return (window.claude&&window.claude.use?window.claude.use('sample'):Promise.resolve(null)).then(function(f){sampleTried=true;sampleFn=f;return f},function(){sampleTried=true;return null})}
function chenyAsk(q){
  q=String(q||'').trim();if(!q||chenyCtl)return;
  chenyTurns.push({role:'user',content:q});$('chenyIn').value='';$('chenyIn').style.height='';chenyRender('');
  $('chenySend').hidden=true;$('chenyStop').hidden=false;
  var ctl=chenyCtl=new AbortController();
  function done(text,err){chenyCtl=null;$('chenySend').hidden=false;$('chenyStop').hidden=true;if(text)chenyTurns.push({role:'assistant',content:text,err:!!err});chenyRender()}
  getSample().then(function(sample){
    if(!sample){done(t('chenyOff'),true);return}
    var hist=chenyTurns.filter(function(x){return !x.err}).slice(-16).map(function(x){return {role:x.role,content:x.content}});
    while(hist.length&&hist[0].role!=='user')hist.shift();
    var input=[{role:'user',content:chenyPrompt()+"\n\n(The conversation starts now.)"}].concat(hist);
    return sample(input,{cache:false,signal:ctl.signal,onText:function(u){if(chenyCtl===ctl)chenyRender(u.text)}}).then(function(r){done(r.text)},function(e){
      var c=e&&e.code;if(c==='cancelled'){done(e.text||'');return}
      var msg=c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'?t('chenyOff'):c==='rate_limited'?t('chenyBusy'):c==='refused'?t('chenyRefused'):t('chenyFail');
      if(e&&e.text&&c!=='refused'){chenyTurns.push({role:'assistant',content:e.text})}done(msg,true)});
  });
}
$('chenyBtn').onclick=function(){chenySetOpen(true)};
$('chenyClose').onclick=function(){if(chenyCtl)chenyCtl.abort();chenySetOpen(false)};
$('chenyNew').onclick=function(){if(chenyCtl)chenyCtl.abort();chenyTurns=[];chenyRender();$('chenyIn').focus()};
$('chenyStop').onclick=function(){if(chenyCtl)chenyCtl.abort()};
$('chenyForm').addEventListener('submit',function(ev){ev.preventDefault();ev.stopPropagation();chenyAsk($('chenyIn').value)});
$('chenySugg').addEventListener('click',function(ev){var b=ev.target.closest('[data-cask]');if(b)chenyAsk(t(b.dataset.cask))});
$('chenyIn').addEventListener('keydown',function(ev){if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();chenyAsk(this.value)}});
$('chenyIn').addEventListener('input',function(){this.style.height='';this.style.height=Math.min(this.scrollHeight+2,120)+'px'});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&chenyOpen){$('chenyClose').click()}});
$('chenyTeach').addEventListener('submit',function(ev){ev.preventDefault();ev.stopPropagation();if(!isOwner||!db)return;var v=$('chenyNotes').value;db.doc('settings/cheny').set({notes:v,updatedAt:Date.now()}).then(function(){toast(t('tChenyTaught'))},fail)});


document.querySelectorAll('form.adder>h3').forEach(function(h){h.tabIndex=0;h.setAttribute('role','button');h.setAttribute('aria-expanded','false');
  var tg=function(){var f=h.parentNode,o=!f.classList.contains('open');f.classList.toggle('open',o);h.setAttribute('aria-expanded',String(o));if(o){var i=f.querySelector('input:not([type=hidden]),textarea,select');if(i)i.focus()}};
  h.addEventListener('click',tg);h.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();tg()}})});
applyStatic();$('unitList').innerHTML=GRADES.en.concat(PEILIM.map(function(x){return x.k})).map(function(v){return '<option value="'+v+'">'}).join('');route();chenyVis();
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    db=r[0];user=r[1];
    return (user?Promise.all([user.isOwner(),user.canEdit(),user.me()]):Promise.resolve([false,false,null])).then(function(x){
      isOwner=!!x[0];isAdmin=!!x[1]||isOwner;var me=x[2];meId=me&&me.id;
      if(me&&me.id){names[me.id]=me.name||t('you')}
      if(db)start();else{ready=true;setLoad('gateSignIn');$('loadBanner').hidden=false}
      renderApp();
    });
  });
}else{ready=true;if(PREVIEW){db=memDb();meId='demo-aviv'}setLoad('outside');$('loadBanner').hidden=false;renderApp()}
})();
</script>
