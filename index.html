<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="bridge.js"></script>
</head>
<body>
<title>Shevet Chen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500&display=swap">
<style>
/* Layout: quiet off-white page, white header with a small green logo pill and text tabs, content in a 1040px column of white cards; pink & green only as small accents */
:root{
  --bg:#f6f1e8; --surface:#ffffff; --ink:#1e3a2f; --muted:#6f8178; --line:#e9e1d6;
  --pink:#f3c9d6; --pink-soft:#fbeef2; --rose:#b84c72;
  --mint:#cfe6d8; --mint-soft:#eef6f1; --green:#2f6b52;
  --butter:var(--pink-soft); --lilac:var(--mint-soft);
  --ok:#2f6b52; --late:#b84c72; --bad:#b84c72; --on-accent:#ffffff;
  --logo-bg:#2f6b52; --l1:#ffffff; --l2:#f7c3d4; --l3:#bfe5cf;
  --display:"Frank Ruhl Libre","Heebo",Georgia,serif;
  --body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --shadow:0 1px 2px rgba(30,58,47,.04),0 4px 16px rgba(30,58,47,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1b2420; --ink:#eef3ef; --muted:#9fb1a7; --line:#2a3530;
  --pink:#5c3443; --pink-soft:#2a1f24; --rose:#f2a9c0; --mint:#2c4a3c; --mint-soft:#1c2a23; --green:#9fd3b6;
  --ok:#9fd3b6; --late:#f2a9c0; --bad:#f2a9c0; --on-accent:#141a17; --logo-bg:#2f6b52;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1b2420; --ink:#eef3ef; --muted:#9fb1a7; --line:#2a3530;
  --pink:#5c3443; --pink-soft:#2a1f24; --rose:#f2a9c0; --mint:#2c4a3c; --mint-soft:#1c2a23; --green:#9fd3b6;
  --ok:#9fd3b6; --late:#f2a9c0; --bad:#f2a9c0; --on-accent:#141a17; --logo-bg:#2f6b52;
  --shadow:none; color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
.bubbles{display:none}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:1.65rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:14px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center;background:var(--logo-bg);border-radius:999px;padding:7px 18px;font-family:var(--display);font-weight:500;font-size:1.15rem;line-height:1.1;white-space:nowrap}
.logo .c0{color:var(--l1)} .logo .c1{color:var(--l2)} .logo .c2{color:var(--l3)}
.brand small{font-size:.8rem;color:var(--muted)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.me-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font-size:.875rem}
[dir="rtl"] .me-btn{padding:4px 4px 4px 14px}
.me-btn:hover{border-color:var(--green)}
.home-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px 28px;flex-wrap:wrap}
.home-hero h2{font-size:2.3rem}
.group-btns{display:flex;flex-wrap:wrap;gap:8px}
.group-btn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--pink);border-radius:999px;padding:10px 20px;cursor:pointer;font-family:var(--display);font-size:1.05rem;color:var(--ink);box-shadow:var(--shadow);text-align:start}
.group-btn small{font-family:var(--body);font-size:.74rem;color:var(--muted);display:block}
.group-btn .arrow{color:var(--rose)}
[dir="rtl"] .group-btn .arrow{transform:scaleX(-1)}
.group-btn:hover{border-color:var(--rose)}
.group-btn.mine{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.group-btn.mine small,.group-btn.mine .arrow{color:inherit;opacity:.85}
.date-badge{width:54px;flex:none;text-align:center;border-radius:14px;background:var(--mint-soft);padding:7px 0;line-height:1.15}
.date-badge b{display:block;font-family:var(--display);font-size:1.45rem;font-weight:500;color:var(--green)}
.date-badge span{font-size:.72rem;color:var(--muted)}
.group-hero{display:grid;gap:6px;border-top:3px solid var(--pink)}
.group-hero h2{font-size:2.1rem}
.task.done b{text-decoration:line-through;color:var(--muted);font-weight:400}
.need-row{display:flex;gap:12px;align-items:center;padding:12px 18px}
.need-row+.need-row{border-top:1px solid var(--line)}
.need-in{margin-top:4px;width:100%;padding:4px 8px!important;font-size:.86rem!important;background:transparent!important;border-color:transparent!important}
.need-in:hover,.need-in:focus{background:var(--surface)!important;border-color:var(--line)!important}
.need-st{font-size:.74rem;border-radius:999px;padding:3px 12px;white-space:nowrap;border:1px solid transparent;font-family:inherit}
button.need-st{cursor:pointer}
.need-st.packed{background:var(--mint-soft);color:var(--green);border-color:var(--mint)}
.need-st.notPacked{background:var(--pink-soft);color:var(--rose);border-color:var(--pink)}
.need-st.none{background:var(--bg);color:var(--muted);border-color:var(--line)}
.mx-cat{padding:18px 18px 6px;font-family:var(--display);font-size:1.02rem;color:var(--green);border-top:1px solid var(--line)}
.mx-cat:first-child{border-top:0;padding-top:14px}
.mx-row{display:flex;gap:12px;align-items:center;padding:9px 18px;flex-wrap:wrap}
.mx-row:hover{background:var(--bg)}
.mx-name{font-weight:500}
.mx-need{margin-inline-start:8px;font-size:.72rem;color:var(--rose)}
.mx-need::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rose);margin-inline-end:5px;vertical-align:middle}
.mx-amt{min-width:72px;text-align:end;color:var(--muted);font-size:.9rem}
.mx-amt-in{width:96px!important;padding:4px 8px!important;text-align:end;background:transparent!important;border-color:transparent!important;color:var(--muted);font-size:.9rem!important}
.mx-amt-in:hover,.mx-amt-in:focus{border-color:var(--line)!important;background:var(--surface)!important;color:var(--ink)}
.mx-x{background:none;border:0;color:var(--muted);font-size:1.15rem;line-height:1;padding:4px 6px;cursor:pointer;border-radius:50%;opacity:.55}
.mx-row:hover .mx-x,.mx-x:focus{opacity:1}.mx-x:hover{color:var(--rose)}
.mx-row .mx-req-form{margin-top:4px}
.mx-count{text-align:center;min-width:64px}
.mx-count b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.mx-count span{font-size:.75rem;color:var(--muted)}
.mx-count b.txt{font-family:var(--body);font-size:.95rem;font-weight:500}
.mx-avail{font-size:.78rem;color:var(--green)}
.mx-avail.low{color:var(--rose)}
.mx-req-form{width:100%;display:grid;gap:10px;background:var(--bg);border-radius:14px;padding:14px}
.st{font-size:.72rem;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.pending{background:var(--pink-soft);color:var(--rose)} .st.approved{background:var(--mint-soft);color:var(--green)}
.st.declined{background:var(--bg);color:var(--muted)} .st.returned{background:var(--bg);color:var(--muted)}
.qty-in{width:84px!important;padding:6px 10px!important;text-align:center}
.me-btn .av{width:30px;height:30px;font-size:.8rem}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av-big{width:96px!important;height:96px!important;font-size:2rem!important}
.photo-pick{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pill{display:inline-block;font-size:.72rem;border-radius:999px;padding:1px 9px;background:var(--mint-soft);color:var(--green)}
.lang{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px;border:1px solid var(--line);gap:2px}
.lang button{border:0;background:none;border-radius:999px;padding:6px 18px;cursor:pointer;color:var(--muted);font-size:.9rem}
.lang button[aria-pressed="true"]{background:var(--green);color:var(--on-accent);box-shadow:0 1px 3px rgba(30,58,47,.12)}
.lang.big button{padding:8px 22px}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:auto;accent-color:var(--green)}
.tabs-scroll{overflow-x:auto}
.tabs{display:flex;gap:4px;padding-block:6px 0}
.tabs a{color:var(--muted);text-decoration:none;padding:10px 14px 12px;white-space:nowrap;font-size:.92rem;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--rose)}
.banner{font-size:.875rem}
.banner .wrap{padding-block:10px 0}
.banner>div>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;color:var(--muted)}
.banner.demo>div>div{background:var(--pink-soft);border-color:var(--pink);color:var(--ink)}

main{padding-block:32px 72px}
.view{display:grid;gap:36px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:32px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px;min-width:0}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 20px;cursor:pointer;font-size:.9rem;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.green{background:var(--mint-soft);border-color:var(--mint);color:var(--green)}
.btn.warn{border-color:var(--pink);color:var(--rose)}
.btn.sm{padding:5px 14px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--rose);cursor:pointer;text-decoration:none;font-size:inherit;border-bottom:1px solid currentColor}
a.link{line-height:1.2}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
form.card{display:grid;gap:14px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
label{display:grid;gap:6px;font-size:.84rem;color:var(--muted);min-width:0}
input,select,textarea{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-width:0;width:100%;box-sizing:border-box;color:var(--ink);font-size:.95rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);background:var(--surface)}
textarea{resize:vertical}

.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:14px;align-items:center;padding:14px 18px;flex-wrap:wrap}
.item+.item{border-top:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.empty{padding:28px 20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;font-size:.9rem;background:var(--surface)}
.list>.empty{border:0;border-radius:0}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;align-items:center;gap:14px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);text-decoration:none;font:inherit;width:100%;box-sizing:border-box;min-width:0}
.tile:hover{border-color:var(--rose)}
.tile.main{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.tile.main .tile-sub,.tile.main .arrow{color:inherit;opacity:.85}
.tile .grow{flex:1;min-width:0}
.tile-title{display:block;font-family:var(--display);font-size:1.2rem;line-height:1.25}
.tile-sub{display:block;color:var(--muted);font-size:.86rem;margin-top:2px}
.tile .arrow{color:var(--rose);font-size:1.1rem}
.tile .badge{background:var(--pink-soft);color:var(--rose);border-radius:999px;padding:2px 9px;font-size:.78rem;margin-inline-start:6px;font-family:var(--body);vertical-align:middle;white-space:nowrap;display:inline-block}
.page-help{color:var(--muted);margin:-4px 0 4px;font-size:.95rem}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more>summary{cursor:pointer;color:var(--rose);font-size:.9rem;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'+ '}
details.more[open]>summary::before{content:'− '}
details.more[open]>summary{margin-bottom:12px}
details.more>div{display:grid;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow)}
.stat:nth-child(odd){border-top:3px solid var(--pink)} .stat:nth-child(even){border-top:3px solid var(--mint)}
.stat b{font-family:var(--display);font-size:2.1rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1;order:-1}
.stat b.sm{font-size:1.1rem;line-height:1.35}
.stat .muted{font-size:.82rem}

.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:500;flex:none;font-size:.85rem;color:var(--ink);overflow:hidden}
.tier1{background:var(--pink-soft);color:var(--rose)} .tier2{background:var(--mint-soft);color:var(--green)}
.tier3{background:var(--pink-soft);color:var(--rose)} .tier4{background:var(--mint-soft);color:var(--green)}
.role{font-size:.74rem;border-radius:999px;padding:2px 10px;white-space:nowrap}
.group-h{display:flex;gap:10px;align-items:center;margin-top:22px;margin-bottom:10px}
.group-h:first-child{margin-top:0}
.pct{font-variant-numeric:tabular-nums}

.due{padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-inline-start:3px solid var(--rose);border-radius:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.due .dot{display:none}
.due .grow{flex:1;min-width:0}

.sess{cursor:pointer;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sess[aria-pressed="true"]{border-color:var(--green)}
.ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-variant-numeric:tabular-nums;flex:none}
.mark-row{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.mark-row .grow{flex:1;min-width:0}
.dots{display:inline-flex;gap:6px}
.dots button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.8rem}
.dots button[aria-pressed="true"].p{background:var(--mint);border-color:var(--mint)}
.dots button[aria-pressed="true"].l,.dots button[aria-pressed="true"].a{background:var(--pink);border-color:var(--pink)}
.tally{display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.tally .p{color:var(--green)} .tally .l,.tally .a{color:var(--rose)}

.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cal-head h3{flex:1;text-align:center}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(36px,1fr));gap:4px}
.dow{font-size:.72rem;text-align:center;color:var(--muted);letter-spacing:.06em;padding-bottom:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:50%;border:1px solid transparent;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;padding:0;font-size:.9rem}
.day:hover{background:var(--bg)}
.day.out{opacity:.35}
.day.today{color:var(--rose);font-weight:500}
.day[aria-pressed="true"]{background:var(--green);color:var(--on-accent)}
.day .ds{display:flex;gap:2px;height:5px}
.day .ds i{width:5px;height:5px;border-radius:50%;background:var(--green)}
.day[aria-pressed="true"] .ds i{background:var(--on-accent)}
.ev-time{font-variant-numeric:tabular-nums;min-width:5ch;color:var(--green);font-size:.9rem}
.tag{font-size:.72rem;border-radius:999px;padding:1px 9px;background:var(--mint-soft);color:var(--green);white-space:nowrap}

.cheny-fab{position:fixed;inset-inline-end:22px;bottom:22px;z-index:40;display:flex;align-items:center;gap:8px;padding:7px 18px 7px 7px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;box-shadow:0 6px 24px rgba(30,58,47,.14);cursor:pointer}
[dir=rtl] .cheny-fab{padding:7px 7px 7px 18px}
.cheny-fab:hover{border-color:var(--pink)}
.cheny-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--pink-soft);padding:3px;color:var(--rose);font-family:var(--display);font-weight:700;font-size:1.05rem;flex:none;position:relative}
.cheny-av::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--surface);bottom:0;inset-inline-end:0}
.cheny-av.big{width:40px;height:40px;font-size:1.2rem}
.cheny{position:fixed;inset-inline-end:22px;bottom:22px;z-index:41;width:min(400px,calc(100vw - 32px));height:min(600px,calc(100vh - 44px));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 48px rgba(30,58,47,.2);display:flex;flex-direction:column;overflow:hidden}
.cheny-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.cheny-head b{font-family:var(--display);font-size:1.08rem}
.cheny-icon{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:.8rem;padding:4px 8px;border-radius:999px;white-space:nowrap}
.cheny-icon:hover{background:var(--bg);color:var(--ink)}
#chenyClose{font-size:1.3rem;line-height:1}
.cheny-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.c-msg{max-width:88%;padding:9px 13px;border-radius:16px;line-height:1.5;overflow-wrap:anywhere;font-size:.93rem}
.c-msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-end-start-radius:6px}
.c-msg.me{background:var(--green);color:#fff;align-self:flex-end;border-end-end-radius:6px;white-space:pre-wrap}
.c-msg.bot p{margin:0 0 6px}.c-msg.bot p:last-child{margin:0}
.c-msg.bot ul{margin:4px 0;padding-inline-start:18px}
.c-msg.err{color:var(--rose)}
.c-think{color:var(--muted);font-style:italic}
.cheny-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0;background:var(--surface)}
.cheny-sugg button{font:inherit;font-size:.78rem;border:1px solid var(--line);background:var(--surface);color:var(--green);border-radius:999px;padding:4px 11px;cursor:pointer}
.cheny-sugg button:hover{border-color:var(--green)}

function memDb(){
  function arr(c){var k=MEMC[c];if(!k||!SAMPLE)return null;SAMPLE[k]=SAMPLE[k]||[];return SAMPLE[k]}
  function clone(d){d=JSON.parse(JSON.stringify(d||{}));if(viewAs){['authorId','requesterId','by'].forEach(function(f){if(d[f]===meId)d[f]=viewAs})}return d}
  function find(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return i;return -1}
  function done(){setTimeout(renderApp,0);return Promise.resolve()}
  function ref(c,id){return {id:id,
    set:function(d){if(c==='settings'&&id==='access'){SAMPLE.access=clone(d);return done()}var a=arr(c);if(a){var o=Object.assign(clone(d),{id:id}),i=find(a,id);if(i>=0)a[i]=o;else a.push(o)}return done()},
    update:function(d){var a=arr(c);if(a){var i=find(a,id);if(i>=0)Object.assign(a[i],clone(d))}return done()},
    delete:function(){var a=arr(c);if(a){var i=find(a,id);if(i>=0)a.splice(i,1)}return done()}}}
  return {doc:function(path){var p=path.split('/');return ref(p[0],p[1])},
    collection:function(c){return {doc:function(id){return ref(c,id)},add:function(d){var id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),o=Object.assign(clone(d),{id:id});
      if(c==='replies'){SAMPLE.replies=SAMPLE.replies||{};(SAMPLE.replies[o.bid]=SAMPLE.replies[o.bid]||[]).push(o)}else{var a=arr(c);if(a)a.push(o)}
      return done().then(function(){return {id:id}})}}}};
}

function processPhoto(file,cb){
  if(!file||!/^image\//.test(file.type)){toast(t('photoFail'));return}
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var z=192,c=document.createElement('canvas');c.width=c.height=z;var g=c.getContext('2d'),m=Math.min(img.width,img.height);
    g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z);URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',.82))};
  img.onerror=function(){URL.revokeObjectURL(url);toast(t('photoFail'))};img.src=url;
}

var chenyTurns=[],chenyCtl=null,chenyOpen=false,sampleFn=null,sampleTried=false;
var CHENY_RULES=[
"You are \"Cheny The AI\" (Hebrew: צ׳ני), the friendly assistant inside the Shachbag app of Shevet Chen, a shevet (troop) of Tzofim, the Israeli Scouts. Your name comes from the shevet's name, Chen (חן).",
"Personality: warm, upbeat, a proud member of Shevet Chen, like a helpful older madricha. Short, clear answers (usually under 150 words) unless asked for more, like a full peula plan. Use simple Markdown only: **bold**, short '- ' bullet lists, paragraphs. No headings, no tables.",
"Language: answer in the language of the user's latest message (Hebrew or English). If mixed, use the app language given below. Tzofim words like peula, tekes, machane, shevet, madrich, chanich, shachbag can stay in Hebrew transliteration in English answers.",
"Truth: use the APP DATA and SHEVET NOTES below for anything about this shevet, its people, events, messages and machsan. Never invent people, dates, quantities or shevet history. If something is not in the data or notes and you are not sure, say you don't know and suggest asking the merakzim, or say Aviv can add it under Settings > Teach Cheny. General Tzofim knowledge is fine; flag anything you are unsure of.",
"Privacy and safety: you talk with teens and young counselors. Keep it kind and age-appropriate. Don't share phone numbers or emails unless the person asks for a specific team member's contact and it appears in the data. For anything about a child's safety, medical emergencies or abuse, tell them to tell a merakez or trusted adult right away (and call emergency services in an emergency).",
"",
"== ABOUT TZOFIM (general knowledge) ==",
"- Tzofim (צופים) = the Israeli Scout movement (Hitachdut HaTzofim VeHaTzofot B'Israel), founded in 1919, the largest youth movement in Israel, coed, and a member of the world scout organizations (WOSM, WAGGGS). Tzofim also runs shvatim abroad (for example Israeli Scouts in North America) and the summer Friendship Caravan delegations.",
"- Values: Zionism and connection to Israel, Jewish/Israeli culture, leadership, volunteering, nature and outdoor skills, independence and responsibility, togetherness. The scout motto is 'Heye Nachon' (היה נכון, Be prepared).",
"- Structure: a shevet (שבט) is a local troop, split into shichvot (grades). Chanichim (חניכים) are the kids; madrichim (מדריכים) are the teen counselors who lead them; the Shachbag (שכב״ג, the senior/leading teen layer) runs the shevet day-to-day, under the merakzim and adult staff. Peilim (פעילים) are teens who work behind the scenes (logistics, decor, tekes, etc.).",
"- Common words: peula (פעולה, a weekly activity a madrich runs), tekes (טקס, ceremony), mifkad (מפקד, formation/roll-call line-up), machane (מחנה, camp), tiyul (טיול, hike/trip), tilboshet (תלבושת, uniform: usually the scout shirt with the shevet's anivit/neckerchief), anivit (עניבה, scarf), hadracha (הדרכה, counseling), ma'arach (מערך, a planned activity layout), sicha (שיחה, discussion), gibush (גיבוש, bonding), shetach (שטח, outdoor field skills), pioneering/knots (קשרים, עבודות שטח).",
"- A good peula has: a clear goal (matara), an opening game/hook, a main activity, a sicha or reflection, and a closing; timing, materials list, and a backup plan. Adjust to the age group.",
"",
"== SHEVET CHEN SHACHBAG ROLES (from the app) ==",
"- Merakez Mifalim (מרכז מפעלים): runs all rashatzim and peilim, and every shevet event.",
"- Merakez Tzeirim (מרכז צעירים): leads the madrichim and rashgadim of grades 2–5.",
"- Merakezet Bogeret (מרכזת בוגרת) and Merakez Boger (מרכז בוגר): lead the madrichim and rashgadim of grades 6–9.",
"- Madrich Tet (מדריך ט׳): counsels 9th grade and prepares next year's madrichim.",
"- Rashgad (רשג״ד, rosh shichva): in charge of the madrichim of one grade.",
"- Rashatz (רש״צ, rosh tzevet): in charge of one group of peilim.",
"- Madrich/a: counselor for a grade of chanichim. Peil/a: works behind the scenes.",
"- Aviv is the app owner and approves everyone who joins.",
"",
"== HOW THE APP WORKS ==",
"- Sign-up: new people choose the Shachbag portal or the Parent portal, enter name, email, phone, their position and grade or peilim group, plus a username and picture. Aviv approves each person into that group. No password.",
"- Home: hello, your group button (e.g. '4th Grade' or 'Peilim Tzofiut'), upcoming events, latest message.",
"- Group page (tap your group button): to-do tasks for your group, upcoming events for your role, your team, and messages for your group.",
"- People: everyone by position, with attendance rings.",
"- Attendance: 'Yes / No' sheet (names x dates, tap to mark came/absent) and 'Absences' chart (how many times each person was absent).",
"- Calendar: month view; add events with who can see them, a reminder, 'Add to Google Calendar' and 'Copy for WhatsApp'. A reminder can be sent to the chat in one tap.",
"- Messages: the shachbag chat. Only the merakzim (and people Aviv allows) can send; everyone else reads. Each message can be limited to certain positions.",

"- Peulot: on each grade/peilim group page, madrichim and the rashgad write peulot in the shevet format (Date of Peula, Grade of Adracha, how many chanichim, theme(s), goal(s), then a table of Time | Zman + Title | Description | Materials). They can search machsan items and add them; each added item is requested from the machsan right away. Then they Submit for review; merakzim (Peulot tab) leave notes, send back for changes, or approve. Each grade page also has a Group chat and Group calendar run by its rashgad.",
"- Access (Aviv only): choose what each position, and each person, can see and do, and approve or remove people.",

].join("\n");
function chenyData(){
  var d=D(),L=[],a=effApp(),now=ymd(today);
  L.push("== APP DATA (live, what this person may see) ==");
  L.push("Today: "+now+". App language: "+(lang==='he'?'Hebrew':'English')+".");
  var who=meId?nameOf(viewAs?'':meId):'';
  L.push("Talking with: "+(full()?(who||'the owner')+" (Aviv/owner or editor, full access)":(who||'a member')+(a&&a.role?", position "+(ROLE[a.role]?ROLE[a.role].en:a.role)+(a.unit?", group "+a.unit:""):""))+".");
  var perms=ALLP.filter(function(p){return can(p)});L.push("They can: "+perms.join(", ")+".");
  if(can('people')){L.push("\nPEOPLE ("+d.roster.length+"):");d.roster.slice(0,150).forEach(function(m){L.push("- "+m.name+" | "+(ROLE[m.role]?ROLE[m.role].en:m.role)+(m.unit?" | "+m.unit:"")+(m.phone?" | "+m.phone:""))})}
  var ev=d.events.filter(function(e){return e.date>=now}).sort(function(x,y){return (x.date+(x.time||'')).localeCompare(y.date+(y.time||''))}).slice(0,25);
  L.push("\nUPCOMING EVENTS:");if(!ev.length)L.push("- none");ev.forEach(function(e){L.push("- "+e.date+(e.time?" "+tm(e):"")+" | "+e.title+(e.place?" | at "+e.place:"")+" | for "+aname(e)+(e.notes?" | notes: "+e.notes:""))});
  var past=d.events.filter(function(e){return e.date<now}).sort(function(x,y){return y.date.localeCompare(x.date)}).slice(0,8);
  if(past.length){L.push("RECENT PAST EVENTS:");past.forEach(function(e){L.push("- "+e.date+" | "+e.title)})}
  var bs=d.broadcasts.slice().sort(function(x,y){return y.createdAt-x.createdAt}).slice(0,15);
  L.push("\nRECENT CHAT MESSAGES (newest first):");if(!bs.length)L.push("- none");bs.forEach(function(b){L.push("- "+ymd(new Date(b.createdAt))+" "+nameOf(b.authorId)+" to "+aname(b)+": "+String(b.text).slice(0,400))});
  var g=myGroup();if(g){var tk=(d.tasks||[]).filter(function(x){return x.role===g.role&&norm(x.unit||'')===norm(g.unit||'')});L.push("\nTHEIR GROUP TASKS:");if(!tk.length)L.push("- none");tk.forEach(function(x){L.push("- "+(x.done?"[done] ":"")+x.text+(x.due?" (due "+x.due+")":""))})}
  if(can('attendance')&&d.sessions.length){L.push("\nATTENDANCE ("+d.sessions.length+" dates): absences per person");d.roster.forEach(function(m){var ss=d.sessions.filter(function(x){return x.marks&&x.marks[m.id]});if(ss.length)L.push("- "+m.name+": absent "+ss.filter(function(x){return x.marks[m.id]==='a'}).length+" of "+ss.length)})}
  var pls=(d.peulot||[]);if(pls.length){L.push("\nPEULOT:");pls.slice(0,40).forEach(function(x){L.push("- "+(x.date||"no date")+" | "+gkLabel(x)+" | "+(x.title||"untitled")+" | "+(x.status||"draft"))})}
  if(can('machsan')){
    L.push("\nMACHSAN ITEMS (name: amount | category):");(d.items||[]).slice().sort(function(x,y){return String(x.category||'').localeCompare(String(y.category||''))}).forEach(function(i){var num=typeof i.qty==='number';L.push("- "+i.name+": "+(num?i.qty+(mxOut(i.id)?" ("+(i.qty-mxOut(i.id))+" available now)":""):(i.amount||'?'))+(i.category?" | "+i.category:"")+(i.location?" | "+i.location:"")+(i.needMore?" | NEED MORE":""))});
    L.push("WHAT EACH GROUP NEEDS:");(d.needs||[]).forEach(function(n){L.push("- "+n.group+" ("+(n.people||'')+"): "+(n.materials||'no materials')+" | "+({packed:'Packed',notPacked:'Not packed',none:'No materials'}[n.status]||n.status))});
    var rq=(d.mxReqs||[]).slice(0,25);if(rq.length){L.push("MACHSAN REQUESTS:");rq.forEach(function(r){L.push("- "+nameOf(r.requesterId)+": "+r.itemName+" x"+r.qty+" on "+r.from+(r.to?" until "+r.to:"")+" | "+r.status+(r.note?" | "+r.note:""))})}
  }
  return L.join("\n");
}
function chenyPrompt(){var notes=(demo?'':S.chenyNotes)||'';return CHENY_RULES+"\n\n== SHEVET NOTES (written by Aviv, trust these) ==\n"+(notes.trim()||"(none yet)")+"\n\n"+chenyData().slice(0,60000)}
function chenyMd(tx){var lines=esc(tx).split(/\n/),h='',inUl=false;lines.forEach(function(l){l=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');var m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!inUl){h+='<ul>';inUl=true}h+='<li>'+m[1]+'</li>'}else{if(inUl){h+='</ul>';inUl=false}if(l.trim())h+='<p>'+l+'</p>'}});if(inUl)h+='</ul>';return h}
function chenyRender(live){
  var hello=t('chenyHi',{n:(function(){var n=meId&&!viewAs?nameOf(meId):'';return n&&n!==t('someone')?' '+n.split(' ')[0]:''})()});
  var h='<div class="c-msg bot" dir="auto">'+chenyMd(hello)+'</div>';

  if(live!==undefined)h+='<div class="c-msg bot" dir="auto">'+(live?chenyMd(live):'<span class="c-think">'+t('chenyThinking')+'</span>')+'</div>';
  var lg=$('chenyLog');lg.innerHTML=h;lg.scrollTop=lg.scrollHeight;
  $('chenySugg').innerHTML=chenyTurns.length||live!==undefined?'':['chenyS1','chenyS2','chenyS3','chenyS4'].map(function(k){return '<button type="button" data-cask="'+k+'">'+t(k)+'</button>'}).join('');

function getSample(){if(sampleTried)return Promise.resolve(sampleFn);return (window.claude&&window.claude.use?window.claude.use('sample'):Promise.resolve(null)).then(function(f){sampleTried=true;sampleFn=f;return f},function(){sampleTried=true;return null})}
function chenyAsk(q){
  q=String(q||'').trim();if(!q||chenyCtl)return;
  chenyTurns.push({role:'user',content:q});$('chenyIn').value='';$('chenyIn').style.height='';chenyRender('');
  $('chenySend').hidden=true;$('chenyStop').hidden=false;
  var ctl=chenyCtl=new AbortController();
  function done(text,err){chenyCtl=null;$('chenySend').hidden=false;$('chenyStop').hidden=true;if(text)chenyTurns.push({role:'assistant',content:text,err:!!err});chenyRender()}
  getSample().then(function(sample){
    if(!sample){done(t('chenyOff'),true);return}
    var hist=chenyTurns.filter(function(x){return !x.err}).slice(-16).map(function(x){return {role:x.role,content:x.content}});
    while(hist.length&&hist[0].role!=='user')hist.shift();
    var input=[{role:'user',content:chenyPrompt()+"\n\n(The conversation starts now.)"}].concat(hist);
    return sample(input,{cache:false,signal:ctl.signal,onText:function(u){if(chenyCtl===ctl)chenyRender(u.text)}}).then(function(r){done(r.text)},function(e){
      var c=e&&e.code;if(c==='cancelled'){done(e.text||'');return}
      var msg=c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'?t('chenyOff'):c==='rate_limited'?t('chenyBusy'):c==='refused'?t('chenyRefused'):t('chenyFail');
      if(e&&e.text&&c!=='refused'){chenyTurns.push({role:'assistant',content:e.text})}done(msg,true)});
  });
}
