<style>
/* Layout: quiet off-white page, white header with a small green logo pill and text tabs, content in a 1040px column of white cards; pink & green only as small accents */
:root{
  --bg:#f6f1e8; --surface:#ffffff; --ink:#1e3a2f; --muted:#6f8178; --line:#e9e1d6;
  --pink:#f3c9d6; --pink-soft:#fbeef2; --rose:#b84c72;
  --mint:#cfe6d8; --mint-soft:#eef6f1; --green:#2f6b52;
  --butter:var(--pink-soft); --lilac:var(--mint-soft);
  --ok:#2f6b52; --late:#b84c72; --bad:#b84c72; --on-accent:#ffffff;
  --logo-bg:#2f6b52; --l1:#ffffff; --l2:#f7c3d4; --l3:#bfe5cf;
  --display:"Frank Ruhl Libre","Heebo",Georgia,serif;
  --body:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --shadow:0 1px 2px rgba(30,58,47,.04),0 4px 16px rgba(30,58,47,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1b2420; --ink:#eef3ef; --muted:#9fb1a7; --line:#2a3530;
  --pink:#5c3443; --pink-soft:#2a1f24; --rose:#f2a9c0; --mint:#2c4a3c; --mint-soft:#1c2a23; --green:#9fd3b6;
  --ok:#9fd3b6; --late:#f2a9c0; --bad:#f2a9c0; --on-accent:#141a17; --logo-bg:#2f6b52;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1b2420; --ink:#eef3ef; --muted:#9fb1a7; --line:#2a3530;
  --pink:#5c3443; --pink-soft:#2a1f24; --rose:#f2a9c0; --mint:#2c4a3c; --mint-soft:#1c2a23; --green:#9fd3b6;
  --ok:#9fd3b6; --late:#f2a9c0; --bad:#f2a9c0; --on-accent:#141a17; --logo-bg:#2f6b52;
  --shadow:none; color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased}
.bubbles{display:none}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:1.65rem} h3{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.muted{color:var(--muted)} .small{font-size:.875rem}
.label{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:14px 6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center;background:var(--logo-bg);border-radius:999px;padding:7px 18px;font-family:var(--display);font-weight:500;font-size:1.15rem;line-height:1.1;white-space:nowrap}
.logo .c0{color:var(--l1)} .logo .c1{color:var(--l2)} .logo .c2{color:var(--l3)}
.brand small{font-size:.8rem;color:var(--muted)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.me-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px 4px 4px;cursor:pointer;font-size:.875rem}
[dir="rtl"] .me-btn{padding:4px 4px 4px 14px}
.me-btn:hover{border-color:var(--green)}
.logo-img{margin:0;line-height:0;color:var(--ink)}
.logo-img svg [fill="currentColor"]{stroke:currentColor;stroke-width:2.2;paint-order:stroke}.logo-img a{display:block;color:inherit}.logo-img svg{height:78px;width:auto;display:block}
#logo svg:not(.lg-h){display:none!important}#logo svg.lg-h{height:44px!important;width:auto}
@media (max-width:600px){.logo-img svg{height:60px}}
.home-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px 28px;flex-wrap:wrap}
.home-hero h2{font-size:2.3rem}
.group-btns{display:flex;flex-wrap:wrap;gap:8px}
.group-btn{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--pink);border-radius:999px;padding:10px 20px;cursor:pointer;font-family:var(--display);font-size:1.05rem;color:var(--ink);box-shadow:var(--shadow);text-align:start}
.group-btn small{font-family:var(--body);font-size:.74rem;color:var(--muted);display:block}
.group-btn .arrow{color:var(--rose)}
[dir="rtl"] .group-btn .arrow{transform:scaleX(-1)}
.group-btn:hover{border-color:var(--rose)}
.group-btn.mine{background:var(--green);border-color:var(--green);color:var(--on-accent)}
.group-btn.mine small,.group-btn.mine .arrow{color:inherit;opacity:.85}
.date-badge{width:54px;flex:none;text-align:center;border-radius:14px;background:var(--mint-soft);padding:7px 0;line-height:1.15}
.date-badge b{display:block;font-family:var(--display);font-size:1.45rem;font-weight:500;color:var(--green)}
.date-badge span{font-size:.72rem;color:var(--muted)}
.group-hero{display:grid;gap:6px;border-top:3px solid var(--pink)}
.group-hero h2{font-size:2.1rem}
.task.done b{text-decoration:line-through;color:var(--muted);font-weight:400}
.need-row{display:flex;gap:12px;align-items:center;padding:12px 18px}
.need-row+.need-row{border-top:1px solid var(--line)}
.need-in{margin-top:4px;width:100%;padding:4px 8px!important;font-size:.86rem!important;background:transparent!important;border-color:transparent!important}
.need-in:hover,.need-in:focus{background:var(--surface)!important;border-color:var(--line)!important}
.need-st{font-size:.74rem;border-radius:999px;padding:3px 12px;white-space:nowrap;border:1px solid transparent;font-family:inherit}
button.need-st{cursor:pointer}
.need-st.packed{background:var(--mint-soft);color:var(--green);border-color:var(--mint)}
.need-st.notPacked{background:var(--pink-soft);color:var(--rose);border-color:var(--pink)}
.need-st.none{background:var(--bg);color:var(--muted);border-color:var(--line)}
.mx-cat{padding:18px 18px 6px;font-family:var(--display);font-size:1.02rem;color:var(--green);border-top:1px solid var(--line)}
.mx-cat:first-child{border-top:0;padding-top:14px}
.mx-row{display:flex;gap:12px;align-items:center;padding:9px 18px;flex-wrap:wrap}
.mx-row:hover{background:var(--bg)}
.mx-name{font-weight:500}
.mx-need{margin-inline-start:8px;font-size:.72rem;color:var(--rose)}
.mx-need::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--rose);margin-inline-end:5px;vertical-align:middle}
.mx-amt{min-width:72px;text-align:end;color:var(--muted);font-size:.9rem}
.mx-amt-in{width:96px!important;padding:4px 8px!important;text-align:end;background:transparent!important;border-color:transparent!important;color:var(--muted);font-size:.9rem!important}
.mx-amt-in:hover,.mx-amt-in:focus{border-color:var(--line)!important;background:var(--surface)!important;color:var(--ink)}
.mx-x{background:none;border:0;color:var(--muted);font-size:1.15rem;line-height:1;padding:4px 6px;cursor:pointer;border-radius:50%;opacity:.55}
.mx-row:hover .mx-x,.mx-x:focus{opacity:1}.mx-x:hover{color:var(--rose)}
.mx-row .mx-req-form{margin-top:4px}
.mx-count{text-align:center;min-width:64px}
.mx-count b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.mx-count span{font-size:.75rem;color:var(--muted)}
.mx-count b.txt{font-family:var(--body);font-size:.95rem;font-weight:500}
.mx-avail{font-size:.78rem;color:var(--green)}
.mx-avail.low{color:var(--rose)}
.mx-req-form{width:100%;display:grid;gap:10px;background:var(--bg);border-radius:14px;padding:14px}
.st{font-size:.72rem;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.pending{background:var(--pink-soft);color:var(--rose)} .st.approved{background:var(--mint-soft);color:var(--green)}
.st.declined{background:var(--bg);color:var(--muted)} .st.returned{background:var(--bg);color:var(--muted)}
.qty-in{width:84px!important;padding:6px 10px!important;text-align:center}
.me-btn .av{width:30px;height:30px;font-size:.8rem}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av-big{width:96px!important;height:96px!important;font-size:2rem!important}
.photo-pick{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pill{display:inline-block;font-size:.72rem;border-radius:999px;padding:1px 9px;background:var(--mint-soft);color:var(--green)}
.lang{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px;border:1px solid var(--line);gap:2px}
.lang button{border:0;background:none;border-radius:999px;padding:6px 18px;cursor:pointer;color:var(--muted);font-size:.9rem}
.lang button[aria-pressed="true"]{background:var(--green);color:var(--on-accent);box-shadow:0 1px 3px rgba(30,58,47,.12)}
.lang.big button{padding:8px 22px}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer}
.switch input{width:auto;accent-color:var(--green)}
.tabs-scroll{overflow-x:auto}
.tabs{display:flex;gap:4px;padding-block:6px 0}
.tabs a{color:var(--muted);text-decoration:none;padding:10px 14px 12px;white-space:nowrap;font-size:.92rem;border-bottom:2px solid transparent}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--rose)}
.banner{font-size:.875rem}
.banner .wrap{padding-block:10px 0}
.banner>div>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;color:var(--muted)}
.banner.demo>div>div{background:var(--pink-soft);border-color:var(--pink);color:var(--ink)}

main{padding-block:32px 72px}
.view{display:grid;gap:36px}
#v-home{gap:22px}
.wg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:701px){.wg-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wg{position:relative;background:#fff;border:0;border-radius:26px;padding:15px 16px;box-shadow:0 8px 24px rgba(30,50,40,.10),0 1px 3px rgba(30,50,40,.06)!important;display:flex;flex-direction:column;gap:8px;min-width:0;color:var(--ink);text-align:start;font:inherit;box-shadow:0 1px 2px rgba(20,40,30,.04);overflow:hidden}
.wg.s{aspect-ratio:1/1;grid-column:span 1}
.wg.m,.wg.l{grid-column:span 2}
.wg.m{aspect-ratio:2.12/1}
.wg.l{aspect-ratio:1/1.02}
@media(min-width:701px){.wg.m{aspect-ratio:2.12/1}}
.wg.l .wg-portals,.wg.m .wg-portals{overflow:auto;min-height:0}
.wg.fill-g{background:linear-gradient(160deg,#3a7a5f,#2f6b52)}
.wg.fill-g,.wg.fill-g .wg-h,.wg.fill-g .wg-sub,.wg.fill-g .wg-big,.wg.fill-g .wg-h svg{color:#fff!important}
.wg.fill-p{background:linear-gradient(160deg,#fdeef3,#f8dde7)}
.wg.fill-m{background:linear-gradient(160deg,#f1f8f4,#e2f0e8)}
.wg.fill-p .wg-pt,.wg.fill-m .wg-pt{background:#fff}
button.wg,a.wg{cursor:pointer;text-decoration:none}
.wg:active{transform:scale(.98)}
.wg-h{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.wg-h svg{width:16px;height:16px;color:var(--green);flex:none}
.wg.pink .wg-h svg{color:var(--rose)}
.wg-big.word{font-size:1.75rem;letter-spacing:-.01em}
.wg-big{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--green)}
.wg.pink .wg-big{color:var(--rose)}
.wg-sub{font-size:.9rem;color:var(--muted);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wg-t{font-weight:700;font-size:1.02rem;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wg.s .wg-foot{margin-top:auto}
.wg-today{margin-top:auto}
.wg-today .dw{color:var(--rose);font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em}
.wg-today .dn{font-size:3.2rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.wg-ev{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wg-ev:first-of-type{border-top:0}
.wg-ev .db{flex:none;width:44px;text-align:center;border-radius:12px;background:var(--bg,#f6f3ee);padding:5px 0}
.wg-ev .db b{display:block;font-size:1.15rem;line-height:1.1}
.wg-ev .db span{font-size:.68rem;color:var(--rose);font-weight:700;text-transform:uppercase}
.wg-ev .grow{min-width:0;flex:1}
.wg-ev .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.98rem}
.wg-ev .grow small{color:var(--muted);font-size:.82rem}
.wg-ev.tue .db{box-shadow:inset 3px 0 0 var(--cat-tue)}.wg-ev.sun .db{box-shadow:inset 3px 0 0 var(--cat-sun)}.wg-ev.mach .db{box-shadow:inset 3px 0 0 var(--cat-mach)}.wg-ev.mif .db{box-shadow:inset 3px 0 0 var(--cat-mif)}
.wg-msg{font-size:.98rem;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.wg-portals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:701px){.wg-portals{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wg-pt{display:flex;align-items:center;justify-content:space-between;gap:6px;border:0;border-radius:14px;background:var(--mint-soft,#eef5f1);color:var(--ink);font:inherit;font-weight:700;font-size:.95rem;padding:12px;cursor:pointer;text-align:start;min-width:0}
.wg-pt span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg-pt:nth-child(4n+2),.wg-pt:nth-child(4n+3){background:var(--pink-soft,#fbe9ef)}
.wg-pt i{font-style:normal;color:var(--muted)}
.wg-pt.one{grid-column:1/-1;padding:18px 16px;font-size:1.15rem;background:var(--green);color:#fff}
.wg-pt.one i{color:#fff;opacity:.8}
.wg-pt.one small{display:block;font-weight:500;font-size:.8rem;opacity:.85}
.wg-due{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0}
.wg-due b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg-empty{color:var(--muted);font-size:.92rem}
.wg-x{position:absolute;top:8px;inset-inline-start:8px;width:26px;height:26px;border-radius:50%;border:0;background:#8b9690;color:#fff;font:inherit;font-weight:800;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.wg.dragging{z-index:50;animation:none!important;rotate:0deg;will-change:transform;box-shadow:0 22px 50px rgba(30,50,40,.28)!important;transition:none;opacity:.96}
#v-home.editing #homeWidgets{touch-action:none;user-select:none;-webkit-user-select:none}
#homeWidgets{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wg.flip{transition:transform .26s cubic-bezier(.2,.8,.2,1)!important}
.wg.drop{transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s!important}
.wg-sz{position:absolute;bottom:8px;inset-inline-end:8px;display:none;gap:2px;background:rgba(255,255,255,.95);border-radius:999px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:2}
#v-home.editing .wg-sz{display:flex}
.wg-sz span{min-width:28px;height:26px;padding:0 6px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#4d5a53;cursor:pointer}
.wg-sz span.on{background:#2f6b52;color:#fff}
.wg.s .wg-h a.link{display:none!important}
.wg.s .wg-h span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg.s .wg-t{-webkit-line-clamp:1;font-size:.95rem}
.wg.s .wg-pt.one span{white-space:normal;font-size:1.02rem;line-height:1.2}
.wg.s .wg-pt.one{padding:14px 12px}
.wg-msg.sm{-webkit-line-clamp:5;font-size:.88rem}.wg-msg.lg{-webkit-line-clamp:11}
.wg-mv{position:absolute;bottom:8px;inset-inline-end:8px;display:none;gap:4px;z-index:2}
.wg-mv span{display:flex;align-items:center;justify-content:center;font-size:1.1rem;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.wg-lock{position:absolute;top:10px;inset-inline-end:12px;font-size:.7rem;color:var(--muted);display:none}
#v-home.editing .wg{animation:wgJig .32s ease-in-out infinite alternate;pointer-events:auto}
#v-home.editing .wg:nth-child(even){animation-delay:-.16s}
#v-home.editing .wg-x{display:flex}
#v-home.editing .wg-mv{display:flex}
#v-home.editing .wg-lock{display:block}
#v-home.editing .wg>*:not(.wg-x):not(.wg-sz):not(.wg-lock){pointer-events:none}
@keyframes wgJig{from{rotate:-.6deg}to{rotate:.6deg}}
@media (prefers-reduced-motion:reduce){#v-home.editing .wg{animation:none}}
.wg-edit-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.ci-btn{display:inline-flex;align-items:center;gap:7px;background:var(--green)!important;border-color:var(--green)!important;color:#fff!important;transition:transform .15s,opacity .2s,background .2s}
.ci-btn[hidden]{display:none}
.ci-btn svg{width:18px;height:18px;flex:none}
.ci-btn:active{transform:scale(.95)}

.ci-btn.done{background:var(--surface)!important;color:var(--green)!important}
.ci-btn.busy{opacity:.8}
.ci-btn .ci-spin{width:16px;height:16px}
#v-home.editing .ci-btn{display:none}
.wg-edit-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 22px;font:inherit;font-weight:700;cursor:pointer}
#v-home.editing .wg-edit-btn{background:var(--green);border-color:var(--green);color:#fff}
.wg-add h3{margin:0 0 10px;font-size:1rem}

:root{--bg:#f7f7f4;--surface:#fff;--ink:#17211c;--muted:#68736d;--line:#e5e5df;--r:12px;
  --display:"Heebo",system-ui,-apple-system,"Segoe UI",sans-serif;--shadow:0 1px 2px rgba(16,24,20,.04);--rose:#c0507a;--pink:#f2d2dd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111614;--surface:#181f1c;--line:#26302b;--shadow:none}}
:root[data-theme="dark"]{--bg:#111614;--surface:#181f1c;--line:#26302b;--shadow:none}
body{font-size:15px;line-height:1.55}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
h2{font-size:1.15rem} h3{font-size:1rem}
.home-hero h2{font-size:1.65rem} .group-hero h2{font-size:1.5rem}
.label{letter-spacing:.06em;font-size:.7rem}
main{padding-block:24px 72px}
.view{gap:24px}
.cols{gap:24px}
.card{padding:18px 20px}
.btn{border-radius:8px;padding:8px 16px;font-weight:500}
.btn.sm{border-radius:7px;padding:5px 12px}
input,select,textarea{border-radius:8px;background:var(--surface);padding:9px 12px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 15%,transparent)}
.me-btn{border-radius:8px;padding:4px 12px 4px 4px}
[dir="rtl"] .me-btn{padding:4px 4px 4px 12px}
.me-btn .av{width:28px;height:28px}
.group-btns{gap:8px}
.group-btn{border-radius:10px;border-color:var(--line);box-shadow:none;font-family:var(--body);font-weight:500;font-size:.95rem;padding:9px 14px}
.group-btn:hover{border-color:var(--green)}
.group-btn .arrow{color:var(--muted)}
.date-badge{border-radius:10px;width:48px;padding:6px 0}
.date-badge b{font-family:var(--body);font-weight:600;font-size:1.2rem}
.empty{border:0;background:none;text-align:start;padding:14px 2px}
.list>.empty{padding:16px 18px}
.page-help{font-size:.9rem;margin:-8px 0 0}
.item{padding:12px 16px}
.lang,.seg{border-radius:9px}
.lang button,.seg button{border-radius:7px}
.lang button[aria-pressed="true"]{box-shadow:none}
.pill,.tag,.role,.st,.pst,.need-st{border-radius:6px}
.due{border-radius:10px}
.adder:not(.open)>h3{border-radius:8px;border-style:solid;border-color:var(--line);color:var(--ink);font-weight:500;padding:8px 14px}
.adder:not(.open)>h3::before{color:var(--green)}
.adder:not(.open)>h3:hover{border-color:var(--green)}
details.more>summary{color:var(--green)}
a.link,.link{color:var(--green);border-bottom:0;font-weight:500}
.banner.demo>div>div,.banner>div>div{border-radius:10px}
.mx-cat{font-family:var(--body);font-weight:600;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.chat{border-radius:var(--r)}
.cheny-fab{box-shadow:0 2px 10px rgba(16,24,20,.12)}
/* nav with icons */
.tabs a{display:inline-flex;align-items:center;gap:7px;font-weight:500;padding:10px 12px 12px}
.tabs a svg{width:18px;height:18px;flex:none;opacity:.8}
.tabs a[aria-current="page"]{border-bottom-color:var(--green);color:var(--green)}
.tabs a[aria-current="page"] svg{opacity:1}
@media (max-width:700px){
  #tabsWrap{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px);max-width:none}
  .tabs{padding:0;gap:0;justify-content:space-around}
  .tabs a{flex:1 1 0;min-width:0;flex-direction:column;gap:3px;font-size:.62rem;padding:8px 1px 7px;border-bottom:0;border-top:2px solid transparent;justify-content:center}
  .tabs a svg{width:22px;height:22px}
  .tabs a span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tabs a[aria-current="page"]{border-top-color:var(--green)}
  main{padding-bottom:110px}
  .cheny-fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .home-hero h2{font-size:1.45rem}
  .bar{padding-block:10px}
}
.mx-search{display:block}.mx-search input{padding:11px 14px;font-size:1rem}
.mx-req-line{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.mx-req-line label:first-child{width:90px}.mx-req-line .grow{flex:1;min-width:160px}
.mx-req-form{border-radius:10px}

/* v28 cleaner peula page */
#peulaBox{max-width:860px;margin-inline:auto;width:100%;min-width:0}
.pdoc{min-width:0;box-sizing:border-box;padding:24px clamp(16px,3.5vw,32px);gap:24px;box-shadow:none}
.pf-lines{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.pf-line{flex-direction:column;align-items:stretch;gap:5px;min-width:0}
.pf-line.col,.pf-lines>.small{grid-column:1/-1}
.pf-line label,.pf-lab{font-family:var(--body);font-weight:600;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:normal}
.pf-val{font-family:var(--body);font-size:1rem;font-weight:500;color:var(--ink);padding:10px 0}
.pf-line input{min-width:0;max-width:none!important;width:100%;box-sizing:border-box}
.pdoc input:disabled,.pdoc textarea:disabled{padding-block:10px}
.pdoc-sec{gap:10px;border-top:1px solid var(--line);padding-top:20px}
.pdoc-sec h3{font-size:1rem;font-weight:600;color:var(--ink)}
.plan-wrap{overflow:visible;border:1px solid var(--line);border-radius:10px}
.plan{min-width:0;border:0;table-layout:fixed}
.plan td{border:0;border-top:1px solid var(--line)}
.plan td+td{border-inline-start:1px solid var(--line)}
.plan th{font-family:var(--body);font-weight:600;font-size:.72rem!important;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)!important;background:var(--bg);padding:9px 10px!important}
.plan th:first-child{border-start-start-radius:10px}.plan th:last-child{border-start-end-radius:10px}
.plan td textarea{font-size:.92rem!important;line-height:1.5}
.plan td.tm,.plan th:nth-child(1){width:72px}.plan td.zm,.plan th:nth-child(2){width:24%}.plan td.mt,.plan th:nth-child(4){width:22%}.plan td.x,.plan th.x{width:34px}
.plan td.x{text-align:center;vertical-align:middle}
#plActions{padding-inline:4px}
@media (max-width:700px){
  .pf-lines{grid-template-columns:minmax(0,1fr)}
  .plan-wrap{border:0;border-radius:0}
  .plan,.plan tbody{display:block}
  .plan thead{display:none}
  .plan tr{display:grid;grid-template-columns:72px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;position:relative;padding:6px 4px}
  .plan td{display:block;border:0!important;width:auto!important}
  .plan td::before{content:attr(data-l);display:block;font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px 0}
  .plan td.ds,.plan td.mt{grid-column:1/-1}
  .plan td.x{position:absolute;top:4px;inset-inline-end:4px}
  .plan td.x::before{display:none}
  .pdoc{padding:20px 16px;border-radius:12px}
}
.pdoc textarea:disabled{min-height:0!important;field-sizing:content}
.plan td textarea:disabled{field-sizing:content}

/* ===== v29: iPhone-style ===== */
:root,:root[data-theme="light"]{--display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Heebo",system-ui,sans-serif;--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Heebo",system-ui,sans-serif;--bg:#f4f3ef;--line:rgba(60,60,67,.14);--muted:#8a8a8e;--r:12px;--shadow:none}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
/* nav bar */
header{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.logo-img svg{height:58px!important}
.me-btn{border:0;background:none;padding:4px!important;color:var(--green);font-weight:500}
.me-btn .av{width:30px;height:30px}
/* big page titles */
.large-title{font-size:2.05rem;font-weight:700;letter-spacing:-.02em;margin:6px 0 10px;line-height:1.15}
#v-machsan>.sec-head h2{display:none}
.home-hero h2{font-size:2.05rem!important;font-weight:700;letter-spacing:-.02em}
.home-hero .label{font-size:.8rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.page-help{font-size:.82rem;color:var(--muted);margin:-4px 0 6px}
/* section headers */
.sec-head h2,.stack>h2,.cols h2{font-size:1.3rem;font-weight:700}
.sec-head .link,.sec-head a{color:var(--green);font-weight:400}
/* inset grouped lists */
.card,.list,.chat,.pdoc{border:0!important;box-shadow:none!important;border-radius:var(--r)}
.item{padding:12px 16px;position:relative}
.item+.item{border-top:0}
.item+.item::before{content:'';position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;border-top:.5px solid var(--line)}
/* portals as a list */
.grp-h{font-size:1.3rem;font-weight:700;margin:4px 0 -4px}
.grp-h:has(+ .group-btns:empty){display:none}
.group-btns{display:grid!important;gap:0!important;background:var(--surface);border-radius:var(--r);overflow:hidden}
.group-btn,.group-btn.mine{display:flex;width:100%;justify-content:space-between;align-items:center;border:0!important;border-radius:0!important;background:none!important;color:var(--ink)!important;box-shadow:none!important;padding:13px 16px!important;font-size:1rem!important;font-weight:400!important;position:relative}
.group-btn+.group-btn::before{content:'';position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;border-top:.5px solid var(--line)}
.group-btn:active{background:rgba(0,0,0,.05)!important}
.group-btn .arrow{font-size:0}
.group-btn .arrow::after,.chev{content:'›';font-size:1.35rem;line-height:1;color:#c4c4c7}
[dir=rtl] .group-btn .arrow::after,[dir=rtl] .chev{display:inline-block;transform:scaleX(-1)}
.group-btn small{color:var(--muted)}
/* tags become plain text */
.tag,.pill{background:none!important;padding:0!important;color:var(--muted)!important;font-size:.8rem!important;border-radius:0}
.tag::before{content:'· '}
.st,.pst{background:none!important;border:0!important;padding:0!important;font-weight:500;font-size:.8rem!important}
/* dates like Calendar */
.date-badge{background:none!important;width:42px;padding:2px 0}
.date-badge b{font-family:var(--display);font-weight:600;font-size:1.4rem;color:var(--ink)}
.date-badge span{text-transform:uppercase;font-size:.68rem;font-weight:600;color:var(--rose)}
/* buttons */
.btn{border:0!important;background:rgba(46,107,82,.1);color:var(--green);border-radius:10px;font-weight:500}
.btn.primary{background:var(--green);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.sm{padding:6px 12px}
input:not([type=checkbox]):not([type=radio]),select,textarea{border:0!important;background:rgba(118,118,128,.1)!important;border-radius:10px!important;box-shadow:none!important}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(46,107,82,.35);outline-offset:0}
.adder:not(.open)>h3{border:0!important;background:var(--surface)!important;border-radius:var(--r)!important;width:100%;box-sizing:border-box;padding:13px 16px!important;color:var(--green);font-weight:400!important}
details.more>summary{color:var(--green)}
/* Cheny: small round button */
.cheny-fab{padding:0!important;width:52px;height:52px;justify-content:center;border:0;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.cheny-fab>span:not(.cheny-av){display:none}
.cheny-fab .cheny-av{width:34px;height:34px}
/* More tab */
.tab-more{display:none!important}
.more-row{color:var(--ink);text-decoration:none;font-size:1rem}
.more-row svg{width:22px;height:22px;color:var(--green)}
@media (max-width:700px){
  header{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--bg)!important}
  .logo-img svg{height:54px!important}
  .me-btn>span:not(.av){display:none}
  .bar{padding-block:6px!important}
  #tabsWrap{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line)}
  .tabs a.extra{display:none!important}
  .tabs a.tab-more{display:flex!important}
  .tabs a{font-size:.66rem!important;border-top:0!important;color:#8e8e93;padding:7px 0 5px!important}
  .tabs a[aria-current="page"]{color:var(--green)}
  .large-title,.home-hero h2{font-size:1.85rem!important}
  .cheny-fab{width:48px;height:48px;bottom:calc(72px + env(safe-area-inset-bottom,0px))!important}
}
@media (min-width:701px){#v-more{display:none!important}}
.group-hero{background:none!important;padding:4px 0 0!important}.group-hero h2{font-size:2.05rem!important;font-weight:700;letter-spacing:-.02em}

/* in-app tutorial */
.tour-dim{position:fixed;inset:0;z-index:89;background:rgba(24,36,30,.42);opacity:0;transition:opacity .3s ease}
.tour-dim.on{opacity:1}
.tour-dim.hole{background:none}
.tour-ring{position:fixed;z-index:90;border-radius:16px;box-shadow:0 0 0 9999px rgba(24,36,30,.42),0 0 0 3px #fff,0 0 0 7px rgba(192,80,122,.35);transition:top .35s ease,left .35s ease,width .35s ease,height .35s ease,opacity .25s;pointer-events:none;opacity:0}
.tour-ring.on{opacity:1;animation:tourPulse 2.2s ease-in-out infinite}
@keyframes tourPulse{0%,100%{box-shadow:0 0 0 9999px rgba(24,36,30,.42),0 0 0 3px #fff,0 0 0 7px rgba(192,80,122,.35)}50%{box-shadow:0 0 0 9999px rgba(24,36,30,.42),0 0 0 3px #fff,0 0 0 12px rgba(192,80,122,.12)}}
.tour-card{position:fixed;z-index:91;width:min(340px,calc(100vw - 32px));box-sizing:border-box;background:#fff;color:var(--ink);border-radius:22px;padding:18px 18px 14px;box-shadow:0 18px 50px rgba(20,40,30,.22);display:grid;gap:8px;opacity:0;transform:translateY(8px) scale(.98);transition:opacity .28s ease,transform .28s ease}
.tour-card.on{opacity:1;transform:none}
.tour-card.center{left:50%!important;top:50%!important;width:min(360px,calc(100vw - 40px));text-align:center;justify-items:center;padding:26px 22px 18px;transform:translate(-50%,-46%) scale(.98)}
.tour-card.center.on{transform:translate(-50%,-50%)}
.tour-card .t-logo svg{width:170px;height:auto;color:#111}
.tour-card .t-logo svg [fill="currentColor"]{stroke:currentColor;stroke-width:1.6;paint-order:stroke}
.tour-arrow{position:absolute;width:18px;height:18px;background:#fff;transform:rotate(45deg);border-radius:4px}
.tour-card.below .tour-arrow{top:-7px}
.tour-card.above .tour-arrow{bottom:-7px}
.tour-card:not(.below):not(.above) .tour-arrow{display:none}
.tour-card h3{margin:0;font-size:1.12rem;font-weight:700;position:relative}
.tour-card p{margin:0;line-height:1.55;color:var(--ink);font-size:.95rem;position:relative}
.tour-tips{margin:2px 0 0;padding:0;list-style:none;display:grid;gap:6px;position:relative}
.tour-tips li{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;line-height:1.45;color:var(--muted);text-align:start}
.tour-tips li:before{content:'';flex:none;width:6px;height:6px;border-radius:50%;background:var(--rose);margin-top:.5em}
.tour-foot{display:flex;align-items:center;gap:6px;margin-top:6px;width:100%;position:relative}
.tour-prog{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-inline-end:6px}
.tour-prog i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .35s ease}
.tour-skip,.tour-prev{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;cursor:pointer;padding:8px 6px}
.tour-next:focus{outline:none}.tour-next:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.tour-next{border:0;border-radius:999px;background:var(--green);color:#fff;font:inherit;font-weight:600;padding:9px 18px;cursor:pointer}
.tour-step{font-size:.72rem;color:var(--rose);font-weight:600;letter-spacing:.06em;text-transform:uppercase;position:relative}
@media (prefers-reduced-motion:reduce){.tour-ring.on{animation:none}.tour-card,.tour-ring{transition:none}}
#pendingList .item .grow{flex:1 1 calc(100% - 60px);min-width:0}#pendingList .item label{flex:1 1 150px}

/* ===== v32: ☰ side menu instead of tabs ===== */
header{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--bg)!important}
.bar{flex-wrap:nowrap!important}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;flex:none;border:0;background:none;border-radius:10px;color:var(--ink);cursor:pointer;margin-inline-start:-8px}
.menu-btn:hover{background:rgba(0,0,0,.05)}
.menu-btn[hidden]{display:none}
#tabsWrap{position:fixed!important;top:0!important;bottom:0!important;left:auto!important;right:auto!important;inset-inline-start:0!important;width:min(300px,84vw)!important;max-width:none!important;margin:0!important;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)!important;z-index:60!important;background:var(--surface)!important;border:0!important;box-shadow:0 0 40px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .25s ease;overflow-y:auto;visibility:hidden;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
[dir=rtl] #tabsWrap{transform:translateX(105%)}
#tabsWrap.open{transform:none!important;visibility:visible}
#tabsWrap[hidden]{display:none!important}
.menu-shade{position:fixed;inset:0;z-index:59;background:rgba(10,20,15,.35)}
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 10px 20px;font-size:1.3rem;font-weight:700}
.menu-x{border:0;background:none;font-size:1.7rem;line-height:1;color:var(--muted);cursor:pointer;width:40px;height:40px;border-radius:10px}
#tabsWrap .tabs{display:flex!important;flex-direction:column!important;gap:2px!important;padding:4px 10px 20px!important;justify-content:flex-start!important;overflow:visible!important}
#tabsWrap .tabs a,#tabsWrap .tabs a.extra{display:flex!important;flex-direction:row!important;align-items:center;justify-content:flex-start!important;text-align:start;gap:14px!important;flex:none!important;width:auto!important;min-width:0!important;padding:13px 12px!important;border:0!important;border-radius:10px;font-size:1.02rem!important;font-weight:500;color:var(--ink)!important;white-space:nowrap}
#tabsWrap .tabs a svg{width:22px!important;height:22px!important;color:var(--muted);opacity:1}
#tabsWrap .tabs a:hover{background:rgba(0,0,0,.04)}
#tabsWrap .tabs a[aria-current="page"]{background:rgba(46,107,82,.1);color:var(--green)!important}
#tabsWrap .tabs a[aria-current="page"] svg{color:var(--green)}
#tabsWrap .tabs a span{max-width:none!important;overflow:visible!important}
#tabsWrap .tabs a.tab-more{display:none!important}
body.menu-on{overflow:hidden}
main{padding-bottom:48px!important}
.cheny-fab{bottom:22px!important}
@media (max-width:700px){.cheny-fab{bottom:calc(16px + env(safe-area-inset-bottom,0px))!important}}

/* messages: chat fills the screen */
body.on-messages #lgTitle,body.on-messages #v-messages>.page-help,body.on-messages .cheny-fab{display:none!important}
body.on-messages{overflow:hidden}
body.on-messages #v-messages .chat{position:fixed;top:var(--hdr,64px);left:0;right:0;bottom:0;height:auto!important;min-height:0!important;max-width:none!important;margin:0!important;border:0!important;border-radius:0!important;z-index:4;padding-bottom:env(safe-area-inset-bottom,0px)}
body.on-messages #v-messages .chat-body{padding-inline:max(16px,calc((100vw - 860px)/2))}
body.on-messages #v-messages .chat-head,body.on-messages #v-messages .chat-compose{padding-inline:max(16px,calc((100vw - 860px)/2))}
#tabsWrap .tabs a.tab-set{margin-top:10px;position:relative}#tabsWrap .tabs a.tab-set::before{content:'';position:absolute;top:-6px;left:12px;right:12px;border-top:1px solid var(--line)}

/* v48 font: Nunito (rounded, thick) with Rubik for Hebrew */
:root,:root[data-theme="light"],:root[data-theme="dark"]{--display:"Nunito","Rubik",-apple-system,system-ui,sans-serif;--body:"Nunito","Rubik",-apple-system,system-ui,sans-serif}
body{font-weight:500}
h1,h2,.large-title{font-weight:800}
h3,b,strong,.btn,button{font-weight:700}
body,h1,h2,h3,button,input,select,textarea{font-family:var(--body)}
h1,h2,h3,.large-title,b,strong{letter-spacing:0}

/* v35 simple attendance */
#sessForm,#attTableWrap{display:none!important}
#absChart{background:none!important;padding:0!important;border:0!important}
.abs-n{color:var(--rose);font-weight:600;white-space:nowrap}.abs-n.zero{color:var(--muted);font-weight:400}
#attEvents h2{font-size:1.15rem;margin:8px 0 2px}
#attEvents .item>div:last-child{margin-top:0!important}
.att-sheet{position:fixed;inset:0;z-index:70;background:rgba(10,20,15,.4);display:flex;align-items:flex-end;justify-content:center}
.att-sheet[hidden]{display:none}

 he:{terms:'<p class="draft">טיוטה: לבדיקה של הנהגת השבט.</p><h3>מה זו האפליקציה</h3><p>האפליקציה של שבט חן עוזרת לשכב״ג של שבט חן בצופים לתכנן פעולות, לשתף הודעות, לנהל לוח שנה, לבקש ציוד מהמחסן ולעקוב אחרי נוכחות. היא מופעלת על ידי מתנדבים בשבט, ואינה שירות רשמי של תנועת הצופים.</p><h3>מי יכול להשתמש</h3><p>רק חברי שכב״ג שאושרו על ידי בעל האפליקציה או המרכזים. שמרו על פרטי הכניסה שלכם ואל תתנו לאחרים להשתמש בחשבון.</p><h3>שומרים על כבוד</h3><ul><li>מפרסמים רק דברים שמתאימים למרחב של צוות צופים: בטוחים, מכבדים ומתאימים לגיל.</li><li>לא משתפים פרטים אישיים של אחרים מחוץ לאפליקציה.</li><li>משתמשים במחסן ובפעולות בהגינות ומחזירים מה שלוקחים.</li></ul><h3>תוכן ושינויים</h3><p>מרכזים יכולים להסיר תוכן או אנשים שלא עומדים בכללים. האפליקציה יכולה להשתנות או להפסיק לפעול בכל זמן, והיא ניתנת כמו שהיא, בלי התחייבות.</p><h3>צ׳ני</h3><p>צ׳ני היא עוזרת בינה מלאכותית ויכולה לטעות, אז בדקו דברים חשובים עם מרכז. צ׳ני עוזרת לחשוב על פעולות אבל לא כותבת אותן בשבילכם.</p><h3>שאלות</h3><p>פנו למרכז או לבעל האפליקציה.</p>',
  privacy:'<p class="draft">טיוטה: לבדיקה של הנהגת השבט.</p><h3>מה נאסף</h3><ul><li>שם, אימייל, טלפון, תפקיד ושכבה או קבוצת פעילים, שאתם נותנים כשמבקשים להצטרף.</li><li>שם המשתמש ותמונת הפרופיל.</li><li>מה שאתם מוסיפים: הודעות, פעולות, משימות, אירועים ובקשות מהמחסן.</li><li>נוכחות שמרכזים, רשג״דים או מדריכים מסמנים, כולל שמות חניכים בפורטלים של השכבות.</li></ul><h3>איפה זה נשמר</h3><p>המידע נשמר ב־Google Firebase (Firestore ו־Firebase Authentication). Face ID, אם הפעלתם, נשאר בטלפון שלכם: האפליקציה לא רואה את הפנים שלכם.</p><h3>מי רואה מה</h3><ul><li>רק חברי שכב״ג מאושרים יכולים להיכנס.</li><li>נוכחות הצוות גלויה רק למרכזים.</li><li>פורטל של קבוצה מיועד לקבוצה ולמרכזים.</li><li>כששואלים את צ׳ני, השאלה והמידע שמותר לכם לראות באפליקציה נשלחים לשירות Claude של Anthropic כדי לענות.</li></ul><h3>מה אנחנו לא עושים</h3><p>לא מוכרים מידע, לא מציגים פרסומות ולא משתפים אותו מחוץ לשבט, חוץ מהשירותים שמפעילים את האפליקציה.</p><h3>מחיקת מידע</h3><p>בקשו ממרכז או מבעל האפליקציה להסיר את החשבון ואת מה שהוספתם, והם ימחקו אותו מהאפליקציה.</p><h3>חניכים</h3><p>לנוכחות נשמרים רק שמות (או מה שהצוות מקליד). אל תוסיפו פרטים רגישים על חניכים.</p>'}};

  if(live!==undefined)h+='<div class="c-msg bot" dir="auto">'+(live?chenyMd(live):'<span class="c-think">'+t('chenyThinking')+'</span>')+'</div>';
  var lg=$('chenyLog');lg.innerHTML=h;lg.scrollTop=lg.scrollHeight;
  $('chenySugg').innerHTML=chenyTurns.length||live!==undefined?'':['chenyS1','chenyS2','chenyS3','chenyS4'].map(function(k){return '<button type="button" data-cask="'+k+'">'+t(k)+'</button>'}).join('');
  $('chenyIn').placeholder=t('chenyPh');$('chenySend').setAttribute('aria-label',t('send'));$('chenyStop').setAttribute('aria-label','Stop');
}
function chenyVis(){var m=mode(),on=m==='app'||m==='settings';$('chenyBtn').hidden=!on||chenyOpen;$('chenyPanel').hidden=!on||!chenyOpen;
  var tc=$('chenyTeach');if(tc){tc.hidden=!(isOwner&&!demo&&db);if(!tc.hidden&&document.activeElement!==$('chenyNotes'))$('chenyNotes').value=S.chenyNotes||''}}
function chenySetOpen(o){chenyOpen=o;$('chenyBtn').setAttribute('aria-expanded',String(o));chenyVis();if(o){chenyRender();setTimeout(function(){$('chenyIn').focus()},30)}else $('chenyBtn').focus()}
function getSample(){if(sampleTried)return Promise.resolve(sampleFn);return (window.claude&&window.claude.use?window.claude.use('sample'):Promise.resolve(null)).then(function(f){sampleTried=true;sampleFn=f;return f},function(){sampleTried=true;return null})}
function chenyAsk(q){
  q=String(q||'').trim();if(!q||chenyCtl)return;
  chenyTurns.push({role:'user',content:q});$('chenyIn').value='';$('chenyIn').style.height='';chenyRender('');
  $('chenySend').hidden=true;$('chenyStop').hidden=false;
  var ctl=chenyCtl=new AbortController();
  function done(text,err){chenyCtl=null;$('chenySend').hidden=false;$('chenyStop').hidden=true;if(text)chenyTurns.push({role:'assistant',content:text,err:!!err});chenyRender()}
  getSample().then(function(sample){
    if(!sample){done(t('chenyOff'),true);return}
    var hist=chenyTurns.filter(function(x){return !x.err}).slice(-16).map(function(x){return {role:x.role,content:x.content}});
    while(hist.length&&hist[0].role!=='user')hist.shift();
    var input=[{role:'user',content:chenyPrompt()+"\n\n(The conversation starts now.)"}].concat(hist);
    return sample(input,{cache:false,signal:ctl.signal,onText:function(u){if(chenyCtl===ctl)chenyRender(u.text)}}).then(function(r){done(r.text)},function(e){
      var c=e&&e.code;if(c==='cancelled'){done(e.text||'');return}
      var msg=c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'?t('chenyOff'):c==='rate_limited'?t('chenyBusy'):c==='refused'?t('chenyRefused'):t('chenyFail');
      if(e&&e.text&&c!=='refused'){chenyTurns.push({role:'assistant',content:e.text})}done(msg,true)});
  });
}
$('chenyBtn').onclick=function(){chenySetOpen(true)};
$('chenyClose').onclick=function(){if(chenyCtl)chenyCtl.abort();chenySetOpen(false)};
$('chenyNew').onclick=function(){if(chenyCtl)chenyCtl.abort();chenyTurns=[];chenyRender();$('chenyIn').focus()};
$('chenyStop').onclick=function(){if(chenyCtl)chenyCtl.abort()};
$('chenyForm').addEventListener('submit',function(ev){ev.preventDefault();ev.stopPropagation();chenyAsk($('chenyIn').value)});
$('chenySugg').addEventListener('click',function(ev){var b=ev.target.closest('[data-cask]');if(b)chenyAsk(t(b.dataset.cask))});
$('chenyIn').addEventListener('keydown',function(ev){if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();chenyAsk(this.value)}});
$('chenyIn').addEventListener('input',function(){this.style.height='';this.style.height=Math.min(this.scrollHeight+2,120)+'px'});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&chenyOpen){$('chenyClose').click()}});
$('chenyTeach').addEventListener('submit',function(ev){ev.preventDefault();ev.stopPropagation();if(!isOwner||!db)return;var v=$('chenyNotes').value;db.doc('settings/cheny').set({notes:v,updatedAt:Date.now()}).then(function(){toast(t('tChenyTaught'))},fail)});


document.querySelectorAll('form.adder>h3').forEach(function(h){h.tabIndex=0;h.setAttribute('role','button');h.setAttribute('aria-expanded','false');
  var tg=function(){var f=h.parentNode,o=!f.classList.contains('open');f.classList.toggle('open',o);h.setAttribute('aria-expanded',String(o));if(o){var i=f.querySelector('input:not([type=hidden]),textarea,select');if(i)i.focus()}};
  h.addEventListener('click',tg);h.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();tg()}})});
applyStatic();$('unitList').innerHTML=GRADES.en.concat(PEILIM.map(function(x){return x.k})).map(function(v){return '<option value="'+v+'">'}).join('');route();chenyVis();
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    db=r[0];user=r[1];
    return (user?Promise.all([user.isOwner(),user.canEdit(),user.me()]):Promise.resolve([false,false,null])).then(function(x){
      isOwner=!!x[0];isAdmin=!!x[1]||isOwner;var me=x[2];meId=me&&me.id;
      if(me&&me.id){names[me.id]=me.name||t('you');meFirst=firstName(me.first||'')}
      if(db)start();else{ready=true;window.__shevetReady=true;setLoad('gateSignIn');$('loadBanner').hidden=false}
      renderApp();
    });
  });
}else{ready=true;window.__shevetReady=true;if(PREVIEW){db=memDb();meId='demo-aviv'}setLoad('outside');$('loadBanner').hidden=false;renderApp()}
})();
</script>
